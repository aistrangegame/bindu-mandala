<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bindu Mandala — App Design</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet"/>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080206;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    /* ── Today screen animations ─────────────────────────────── */
    @keyframes todayNameIn {
      0%   { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes todayPromptIn {
      0%   { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .today-name-anim {
      animation: todayNameIn 1.4s cubic-bezier(0.25,0.1,0.25,1) forwards;
    }
    .today-prompt-anim {
      animation: todayPromptIn 1.4s cubic-bezier(0.25,0.1,0.25,1) 0.55s both;
    }

    /* ── Mandala petal breathe ───────────────────────────────── */
    @keyframes petalBreathe {
      0%, 100% { opacity: 0.76; }
      50%       { opacity: 1.0; filter: brightness(1.35) drop-shadow(0 0 6px rgba(196,114,90,0.7)); }
    }
    .petal-breathe {
      animation: petalBreathe 3s ease-in-out infinite;
      transform-origin: center;
    }

    /* ── Recognition ripple rings ────────────────────────────── */
    @keyframes rippleExpand {
      0%   { transform: translate(-50%, -50%) scale(0.08); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(5.5);  opacity: 0; }
    }
    .ripple-ring {
      position: absolute;
      top: 50%; left: 50%;
      width: 90px; height: 90px;
      border-radius: 50%;
      border: 1px solid rgba(201,150,63,0.45);
      animation: rippleExpand 4s ease-out infinite;
      pointer-events: none;
    }

    /* ── Recognition content fade-ins ────────────────────────── */
    @keyframes recognIn {
      0%   { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .recog-name {
      animation: recognIn 1.8s cubic-bezier(0.25,0.1,0.25,1) 0.3s forwards;
    }
    .recog-text {
      animation: recognIn 1.8s cubic-bezier(0.25,0.1,0.25,1) 0.9s forwards;
    }
    .recog-logged {
      animation: recognIn 1s ease 2.6s forwards;
    }
    .recog-reciprocity {
      animation: recognIn 1.4s cubic-bezier(0.25,0.1,0.25,1) 4.1s forwards;
    }

    /* ── Drifting dust motes (temple incense) ─────────────── */
    @keyframes moteRise {
      0%   { transform: translate(0, 0); opacity: 0; }
      8%   { opacity: 1; }
      50%  { transform: translate(calc(var(--drift) * 0.5), -420px); }
      92%  { opacity: 0.5; }
      100% { transform: translate(var(--drift), -880px); opacity: 0; }
    }

    /* ── Silence (Bindu) screen ─────────────────────── */
    @keyframes silenceBreathe {
      0%, 100% { transform: scale(1);    box-shadow: 0 0 48px 12px rgba(139,26,42,0.45), 0 0 96px 32px rgba(139,26,42,0.22); }
      50%      { transform: scale(1.12); box-shadow: 0 0 72px 22px rgba(139,26,42,0.65), 0 0 144px 56px rgba(139,26,42,0.32); }
    }
    .silence-bindu {
      animation: silenceBreathe 6s ease-in-out infinite;
      border-radius: 50%;
    }
    @keyframes silenceNameIn {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }
    .silence-name {
      animation: silenceNameIn 4s ease forwards;
    }
    @keyframes silenceCaptionIn {
      0%, 65% { opacity: 0; transform: translateY(8px); }
      100%    { opacity: 1; transform: translateY(0); }
    }
    .silence-caption {
      animation: silenceCaptionIn 7s ease forwards;
    }

    /* ── Scrollbar — minimal, gold-tinted ────────────────────── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(201,150,63,0.2); border-radius: 2px; }

    /* ── Design canvas overrides ─────────────────────────────── */
    #root { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<div id="root"></div>

<!-- Data -->
<script src="shakti-data.js"></script>

<!-- Component files -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<!-- Main app -->
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas background="#080206" title="Bindu Mandala — iOS App">
      <DCSection id="today" title="Today Screen">
        <DCArtboard id="today-v1" label="With Body Outline" width={390} height={844}>
          <TodayScreenV1/>
        </DCArtboard>
        <DCArtboard id="today-v2" label="Bīja Texture" width={390} height={844}>
          <TodayScreenV2/>
        </DCArtboard>
      </DCSection>

      <DCSection id="journey" title="Journey Screens">
        <DCArtboard id="mandala" label="The Mandala" width={390} height={844}>
          <MandalaScreen/>
        </DCArtboard>
        <DCArtboard id="detail" label="Śakti Detail — Ātmākarṣiṇī" width={390} height={844}>
          <ShaktiDetailScreen/>
        </DCArtboard>
        <DCArtboard id="recognition" label="Recognition Moment" width={390} height={844}>
          <RecognitionMomentScreen/>
        </DCArtboard>
      </DCSection>

      <DCSection id="silence" title="The Silence — Bindu" subtitle="Tap the center of the mandala">
        <DCArtboard id="silence" label="All of her. Undifferentiated." width={390} height={844}>
          <SilenceScreen/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
