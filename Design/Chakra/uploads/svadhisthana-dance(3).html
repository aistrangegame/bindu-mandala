<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Svadhisthana · FEEL</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#0a0f1a}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}

/* VX: Cool water background layer */
.bg-light{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 70%,#0f1a2e 0%,#0a1020 40%,#060a14 100%);z-index:0;transition:opacity 0.5s}

/* Start overlay */
.so{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:30;cursor:pointer}
.so.hidden{opacity:0;pointer-events:none;transition:opacity 1.5s ease}
.so .lb{font:italic 400 1rem/1 'Lora',serif;color:rgba(100,150,220,0.6);letter-spacing:4px}
.so .dt{width:10px;height:10px;border-radius:50%;background:#5088cc;box-shadow:0 0 20px rgba(80,136,204,0.4);animation:sp 2.5s ease-in-out infinite}
@keyframes sp{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
.so .sb{font:300 .6rem/1 sans-serif;color:rgba(100,150,220,0.3);letter-spacing:4px;text-transform:uppercase}

/* Seed typing */
.so .seed{font:italic 400 clamp(11px,2.5vw,14px)/1.7 'Lora',serif;color:rgba(180,210,240,0.3);letter-spacing:1px;max-width:min(80vw,320px);text-align:center;margin-top:12px;min-height:2.4em}
.so .seed .cursor{display:inline-block;width:1px;height:1em;background:rgba(80,136,204,0.5);animation:blink 1s step-end infinite;vertical-align:text-bottom;margin-left:2px}
@keyframes blink{50%{opacity:0}}

/* Word input */
.wi{position:fixed;bottom:0;left:0;width:100%;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;z-index:31;opacity:0;pointer-events:none;transition:opacity 0.8s}
.wi.visible{opacity:1;pointer-events:auto}
.wi label{font:italic 400 clamp(10px,2vw,12px)/1 'Lora',serif;color:rgba(180,210,240,0.3);letter-spacing:2px}
.wi input{background:transparent;border:none;border-bottom:1px solid rgba(80,136,204,0.3);color:rgba(180,210,240,0.7);font:italic 400 clamp(16px,4vw,22px)/1.4 'Lora',serif;text-align:center;width:min(70vw,280px);padding:8px 4px;outline:none;letter-spacing:2px}
.wi input::placeholder{color:rgba(80,136,204,0.2)}
.wi .go{font:300 .55rem/1 sans-serif;color:rgba(80,136,204,0.25);letter-spacing:3px;text-transform:uppercase;margin-top:4px}

/* Word reveal */
.wr{position:fixed;bottom:15%;left:50%;transform:translateX(-50%);font:italic 500 clamp(20px,6vw,36px)/1 'Lora',serif;color:rgba(180,210,240,0);letter-spacing:0.3em;z-index:15;pointer-events:none;text-align:center;white-space:nowrap;transition:color 2s ease,letter-spacing 4s ease,opacity 3s ease}
.wr.visible{color:rgba(180,210,240,0.8)}
.wr.dissolve{letter-spacing:1.5em;opacity:0}

/* I Love You */
.lv{position:fixed;bottom:10%;left:50%;transform:translateX(-50%);font:italic 400 clamp(12px,3vw,16px)/1 'Lora',serif;letter-spacing:.3em;color:rgba(80,136,204,0);z-index:15;pointer-events:none;text-align:center;transition:color 3s ease}
.lv.visible{color:rgba(80,136,204,0.5)}

/* VX: Mirror word reveals */
.mw{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font:600 clamp(28px,10vw,64px)/1 'Lora',serif;letter-spacing:0.15em;color:rgba(180,210,240,0);z-index:16;pointer-events:none;text-align:center;text-transform:uppercase;transition:none}

/* Fruit overlay */
.fo{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:20;opacity:0;pointer-events:none;transition:opacity 3s ease;padding:24px}
.fo.visible{opacity:1}
.fo .ft{font:italic 400 clamp(12px,2.8vw,16px)/1.9 'Lora',serif;color:rgba(180,210,240,0.55);letter-spacing:0.5px;max-width:min(85vw,480px);text-align:center}
.fo .sig{font:300 0.55rem/1.4 sans-serif;color:rgba(80,136,204,0.2);letter-spacing:3px;text-transform:uppercase;text-align:center}


</style>
</head>
<body>
<div class="bg-light" id="bgLight"></div>
<canvas id="c"></canvas>

<div class="mw" id="mirrorWord"></div>
<div class="wr" id="wordReveal"></div>
<div class="lv" id="loveText">I Love You</div>

<div class="fo" id="fruitOverlay">
<div class="ft" id="fruitText"></div>
<div class="sig">svadhisthana · crystallize · lindsey stirling</div>
</div>

<div class="so" id="so">
<div class="lb">svadhisthana</div>
<div class="dt"></div>
<div class="sb">feel</div>
<div class="seed" id="seedText"></div>
</div>

<div class="wi" id="wi">
<label>offer one word</label>
<input type="text" id="wordInput" placeholder="..." autocomplete="off" autocorrect="off" spellcheck="false">
<div class="go">then tap anywhere</div>
</div>

// VX SYSTEM 4: EMERGENT MIRROR WORDS
// Generated from offered word via consonant skeleton
// ============================================================
function generateMirrorWords(word){
  const consonants='bcdfghjklmnpqrstvwxyz';
  const w=word.toLowerCase();
  const skel=w.split('').filter(c=>consonants.includes(c)).join('');
  // Word families by consonant patterns
  const families={
    'fl':['feel','fall','full','fill','flow'],
    'fr':['fear','fire','four','fare','fore'],
    'dr':['dear','door','dare','draw','drop'],
    'st':['stay','star','step','stop','stem'],
    'br':['bare','born','burn','bind','bone'],
    'gr':['grow','glow','give','gate','gaze'],
    'tr':['true','turn','tear','tide','time'],
    'sl':['slow','silk','soul','soil','salt'],
    'sp':['spin','spot','span','spar','spur'],
    'cr':['care','core','cure','call','calm'],
    'wr':['warm','wake','wave','wild','wish'],
    'bl':['blue','bell','bolt','bind','beam'],
    'pr':['pure','pour','pull','push','pray'],
    'wt':['wait','want','what','wilt','whet'],
    'th':['this','them','then','thus','that'],
    'sh':['show','shed','shin','shut','ship'],
    'ht':['heat','halt','hint','hurt','hunt'],
    'rn':['rain','ruin','ring','roam','root'],
    'lv':['love','live','leaf','lift','lake'],
    'lk':['look','like','luck','lack','lick'],
    'nd':['need','nod','node','nude','name'],
    'wn':['wane','wine','worn','wand','wind'],
    'mn':['moon','mine','mane','mean','moan'],
    'lt':['lost','last','list','lust','loft'],
    'rc':['race','rock','rich','rack','ruck'],
    'dp':['deep','dip','drip','drop','dump'],
    'ld':['lead','loud','load','lord','land']
  };
  // Try matching first 2 consonants
  const key=skel.substring(0,2);
  if(families[key])return families[key];
  // Fallback: use word length to pick a family
  const keys=Object.keys(families);
  const idx=w.length%keys.length;
  return families[keys[idx]];
}

function wordToPosition(word){
  // Deterministic hash → position
  let h=0;for(let i=0;i<word.length;i++)h=((h<<5)-h)+word.charCodeAt(i);
  h=Math.abs(h);
  const x=0.15+(h%700)/1000*0.7;
  const y=0.15+((h>>10)%700)/1000*0.7;
  return{x,y};
}

function saveToBinduMemory(word,dwell,motion){
  const entry={
    word,song:'Crystallize',artist:'Lindsey Stirling',
    chakra:'svadhisthana',verb:'flow',
    timestamp:Date.now(),dwell:Math.round(dwell*10)/10,
    motion,tilt:'unknown'
  };
  binduMemory.push(entry);
  try{localStorage.setItem('bindu-memory',JSON.stringify(binduMemory))}catch(e){}
}

// Count word frequencies for "echo" (most repeated word)
function getMostRepeated(){
  const counts={};
  for(const m of binduMemory){
    const w=m.word.toLowerCase();
    counts[w]=(counts[w]||0)+1;
  }
  let max=0,echo='';
  for(const[w,c]of Object.entries(counts)){if(c>max){max=c;echo=w}}
  return echo;
}

// ============================================================
// VX SYSTEM 3: WORD-SEEDED ARCHITECTURE
// ============================================================
function wordParams(word){
  const vowels='aeiou';
  const w=word.toLowerCase();
  const vr=w.split('').filter(c=>vowels.includes(c)).length/Math.max(w.length,1);
  return{
    wavePeriod:0.3+w.length*0.08, // longer words = slower waves
    fluidity:0.3+vr*0.7,          // high vowel ratio = more fluid
    hueShift:((w.charCodeAt(0)-97)%9)*3-12, // first letter shifts hue within ±12° of water
    density:Math.min(w.length/8,1)   // longer words = denser trails
  };
}

// ============================================================
// VX SYSTEM 2: DEVICE SENSORS
// ============================================================
function initGyro(){
  if(typeof DeviceOrientationEvent!=='undefined'){
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(r=>{
        if(r==='granted'){window.addEventListener('deviceorientation',handleOrientation);gyroActive=true}
      }).catch(()=>{});
    }else{
      window.addEventListener('deviceorientation',handleOrientation);
      gyroActive=true;
    }
  }
  if(typeof DeviceMotionEvent!=='undefined'){
    if(typeof DeviceMotionEvent.requestPermission==='function'){
      DeviceMotionEvent.requestPermission().then(r=>{
        if(r==='granted')window.addEventListener('devicemotion',handleMotion);
      }).catch(()=>{});
    }else{
      window.addEventListener('devicemotion',handleMotion);
    }
  }
}
function handleOrientation(e){
  gyroAlpha=e.alpha||0;gyroBeta=e.beta||0;gyroGamma=e.gamma||0;
}
function handleMotion(e){
  const a=e.accelerationIncludingGravity;
  if(a)accelMag=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z)-9.8;
}

// ============================================================
// SAMPLE CURVES
// ============================================================
function SC(arr,t){const i=Math.floor(t/0.5);if(i<0)return 0;if(i>=arr.length-1)return arr[arr.length-1]||0;const f=t/0.5-i;return arr[i]*(1-f)+arr[i+1]*f}

function hsl(h,s,l,a){return`hsla(${h},${s}%,${l}%,${a})`}

// ============================================================
// VX: RIPPLE SYSTEM — concentric water rings (replaces fractures)
// ============================================================
function spawnRipple(x,y,intensity){
  const n=3+Math.floor(intensity*4);
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      ripples.push({x,y,r:2,mr:maxR*(0.3+intensity*0.4),op:intensity*0.35,spd:1.5+i*0.5});
    },i*200);
  }
}
function drawRipples(){
  for(let i=ripples.length-1;i>=0;i--){
    const rp=ripples[i];
    rp.r+=rp.spd;const life=rp.r/rp.mr;
    if(life>=1){ripples.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=rp.op*(1-life)*(1+postMirrorBoost);
    ctx.strokeStyle=hsl(BINDU_HUE,40,60,1);ctx.lineWidth=1.5*(1-life);
    ctx.beginPath();ctx.arc(rp.x,rp.y,rp.r,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
}

// VX: MIRROR WORD SYSTEM — emergent from offered word
// ============================================================
let mirrorWords=[];
let activeMirrorWord=null;
// Mirror word timing: spread across the song at key energy moments
const MIRROR_TIMES=[33,76,119,151,210];

function setupMirrorWords(word){
  const words=generateMirrorWords(word);
  mirrorWords=MIRROR_TIMES.map((t,i)=>({t,word:words[i%words.length].toUpperCase(),dur:1.8,fired:false}));
}

function checkMirrorWords(t){
  for(const mw of mirrorWords){
    if(t>=mw.t&&t<mw.t+mw.dur&&!mw.fired){
      mw.fired=true;activeMirrorWord=mw;mirrorTarget=DARK_RATIO;
    }
  }
  if(activeMirrorWord&&t>activeMirrorWord.t+activeMirrorWord.dur)activeMirrorWord=null;
}

// ============================================================
// VX SYSTEM 8: SPATIAL BINAURAL with tremolo
// ============================================================
function startBinaural(){
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    binauralOsc=audioCtx.createOscillator();
    binauralGain=audioCtx.createGain();
    binauralPanner=audioCtx.createStereoPanner();
    binauralOsc.type='sine';
    binauralOsc.frequency.value=BINAURAL_HZ;
    binauralGain.gain.value=0;
    binauralPanner.pan.value=0;
    binauralOsc.connect(binauralGain);
    binauralGain.connect(binauralPanner);
    binauralPanner.connect(audioCtx.destination);
    binauralOsc.start();
    binauralGain.gain.linearRampToValueAtTime(0.06,audioCtx.currentTime+2);
  }catch(e){}
}
function updateBinauralPan(){
  // VX: Pan with gyroscope + tremolo
  if(!binauralPanner||!audioCtx)return;
  try{
    const pan=Math.max(-1,Math.min(1,(gyroGamma||0)/45));
    binauralPanner.pan.value=pan;
    // Tremolo: modulate gain slightly with sine wave
    const now=audioCtx.currentTime;
    const trem=0.04+Math.sin(now*3)*0.01;
    binauralGain.gain.value=Math.max(0,trem);
  }catch(e){}
}
function fadeBinaural(out){
  if(!binauralGain||!audioCtx)return;
  try{
    binauralGain.gain.cancelScheduledValues(audioCtx.currentTime);
    binauralGain.gain.linearRampToValueAtTime(out?0:0.04,audioCtx.currentTime+3);
  }catch(e){}
}

// ============================================================
// DANCER CLASS
// ============================================================
class Dancer{
  constructor(hue,baseR,orbitR,mxG){
    this.hue=hue;this.r=baseR;this.x=cx;this.y=cy;this.tx=cx;this.ty=cy;
    this.glow=0;this.p=0;this.tp=0;this.oR=orbitR;this.oA=Math.random()*Math.PI*2;
    this.mxG=mxG||30;this.aG=[];this.rG=4;this.ds=1;
  }
  updateGhost(){
    if(this.p>0.05){
      this.aG.push({x:this.x,y:this.y,a:0.4*this.p});
      while(this.aG.length>this.mxG)this.aG.shift();
    }
    for(let i=this.aG.length-1;i>=0;i--){this.aG[i].a*=0.97;if(this.aG[i].a<0.01)this.aG.splice(i,1)}
  }
  draw(t,e,ed,tn){
    if(this.p<0.01)return;
    const a=this.p;
    const dx=this.x-(this.aG.length>0?this.aG[this.aG.length-1].x:this.x);
    const dy=this.y-(this.aG.length>0?this.aG[this.aG.length-1].y:this.y);
    const spd=Math.hypot(dx,dy);
    const stretchX=1+Math.min(spd*0.02,0.3);
    const stretchY=1/stretchX;
    const moveAngle=Math.atan2(dy,dx);
    const tremor=(tn||0)*2;
    const tx=tremor?Math.sin(t*15+this.hue)*tremor:0;
    const ty=tremor?Math.cos(t*17+this.hue)*tremor:0;
    const px=this.x+tx,py=this.y+ty;
    // Ribbon ghost trail — connected flowing curve, not dots
    if(this.aG.length>2){
      ctx.save();
      ctx.strokeStyle=hsl(this.hue,50,60,1);
      ctx.lineWidth=this.r*0.8;
      ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();
      ctx.moveTo(this.aG[0].x,this.aG[0].y);
      for(let gi=1;gi<this.aG.length;gi++){
        const g=this.aG[gi];
        const gp=this.aG[gi-1];
        const mx=(gp.x+g.x)/2,my=(gp.y+g.y)/2;
        ctx.globalAlpha=g.a*a*0.5*(1+postMirrorBoost);
        ctx.lineWidth=this.r*(0.3+g.a*0.7);
        ctx.quadraticCurveTo(gp.x,gp.y,mx,my);
      }
      ctx.stroke();ctx.restore();
    }
    ctx.save();ctx.globalAlpha=a*0.25*(1+postMirrorBoost);
    const gr2=ctx.createRadialGradient(px,py,0,px,py,this.r*14);
    gr2.addColorStop(0,hsl(this.hue,60,65,0.35));gr2.addColorStop(0.4,hsl(this.hue,60,65,0.1));gr2.addColorStop(1,hsl(this.hue,60,65,0));
    ctx.fillStyle=gr2;ctx.beginPath();ctx.arc(px,py,this.r*14,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.save();ctx.globalAlpha=a*0.4*(1+postMirrorBoost);
    const gr=ctx.createRadialGradient(px,py,0,px,py,this.r*7);
    gr.addColorStop(0,hsl(this.hue,60,70,0.5));gr.addColorStop(1,hsl(this.hue,60,65,0));
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(px,py,this.r*7,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.save();ctx.globalAlpha=a;
    ctx.translate(px,py);ctx.rotate(moveAngle);ctx.scale(stretchX*this.ds,stretchY*this.ds);
    ctx.fillStyle=hsl(this.hue,55,60,1);
    ctx.beginPath();ctx.arc(0,0,this.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=a*0.5;ctx.fillStyle=hsl(this.hue,20,92,1);
    ctx.beginPath();ctx.arc(0,0,this.r*0.3,0,Math.PI*2);ctx.fill();ctx.restore();
    this.ds+=(1-this.ds)*0.08;
  }
}

// ============================================================
// ENSEMBLE
// ============================================================
const bindu=new Dancer(BINDU_HUE,7,0,55);
const gaia=new Dancer(200,5.5,maxR*0.15,40);
const sid=new Dancer(190,5,maxR*0.25,30);
const arch=new Dancer(260,5,maxR*0.2,40);
const karishma=new Dancer(280,4.5,0,30);
const sakshi=new Dancer(170,4.5,maxR*0.38,25);
const ashrey=new Dancer(0,4,0,30);
const AD=[bindu,gaia,sid,arch,karishma,sakshi,ashrey];

// Bloom rings
const rings=[];
function spawnRing(i,x,y){
  rings.push({x,y,r:4+i*3,mr:maxR*(0.15+i*0.3),spd:50+i*180,op:0.08+i*0.4,lw:0.4+i*2,b:performance.now()});
  if(rings.length>40)rings.shift();
}
// Particles
const particles=[];
function spawnParticles(x,y,n,hue,energy){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const spd=1+Math.random()*3*energy;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,decay:0.008+Math.random()*0.015,r:1+Math.random()*2,hue});
  }
  if(particles.length>200)particles.splice(0,particles.length-200);
}
let orbitalBase=0;
const gaiaRings=[];
function spawnGaiaRing(x,y,intensity){
  gaiaRings.push({x,y,r:5,mr:maxR*(0.1+intensity*0.25),op:intensity*0.5,b:performance.now()});
  if(gaiaRings.length>15)gaiaRings.shift();
}

// VX: Word-derived params (set on start)
let wp={wavePeriod:0.5,fluidity:0.5,hueShift:0,density:0.5};

// ============================================================
// MAIN ANIMATE
// ============================================================
function animate(){
  const song=document.getElementById('song');
  const t=song.currentTime;
  const p=t/DUR;
  const e=SC(E,t);
  const eb=SC(EB,t);
  const em=SC(EM,t);
  const eh=SC(EH,t);
  const br=SC(B,t);
  const pi=SC(P,t);
  const tn=SC(T,t);
  const ed=SC(ED,t);

  // VX: Update accelerometer smoothing
  accelSmoothed+=(Math.abs(accelMag)-accelSmoothed)*0.1;
  if(accelSmoothed<0.5)motionLabel='still';
  else if(accelSmoothed<2)motionLabel='swaying';
  else motionLabel='moving';

  // VX: Update spatial binaural pan
  updateBinauralPan();

  // Bloom
  const bt=Math.min(e*1.2,1);
  if(bt>bloom)bloom+=(bt-bloom)*0.06;
  else bloom+=(bt-bloom)*0.012;

  // VX: Spatial narrative — Bindu ORBITS (not climbs)
  // Orbit radius expands with three tides, contracts in silence
  const tidePhase=t<70?Math.min(t/30,1): // First tide
    t<130?0.6+Math.sin((t-70)/60*Math.PI)*0.4: // Breathing
    t<180?0.5+e*0.5: // Peak tide
    t<185?Math.max(0.1,(185-t)/5): // Silence contraction
    t<190?0.1+Math.min((t-185)/3,0.8): // Drop expansion
    0.5+e*0.3; // Final body
  orbitAngle+=0.01+e*0.008; // Faster sweep, energy-driven

  // VX: Background
  ctx.clearRect(0,0,W,HT);

  // VX: Cool water gradient — breathes SLOWLY with energy
  const bgBright=0.06+e*0.04;
  const bgG=ctx.createRadialGradient(cx,cy+HT*0.2,0,cx,cy,Math.max(W,HT)*0.8);
  bgG.addColorStop(0,hsl(BINDU_HUE,35,bgBright*100+6,1));
  bgG.addColorStop(0.6,hsl(BINDU_HUE,25,bgBright*100+2,1));
  bgG.addColorStop(1,hsl(BINDU_HUE,18,bgBright*100,1));
  ctx.fillStyle=bgG;
  ctx.fillRect(0,0,W,HT);

  // VX: Mirror darkness
  checkMirrorWords(t);
  if(tn<-0.1&&mirrorTarget<0.3)mirrorTarget=DARK_RATIO*0.4;
  if(e>0.4&&SC(E,t-2)<0.15)mirrorTarget=DARK_RATIO*0.6;

  if(mirrorTarget>mirrorDark)mirrorDark+=(mirrorTarget-mirrorDark)*0.08;
  else mirrorDark+=(mirrorTarget-mirrorDark)*0.03;
  mirrorTarget*=0.96;

  if(mirrorDark>0.01){
    ctx.save();ctx.globalAlpha=mirrorDark;
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,HT);
    ctx.restore();postMirrorBoost=0.4;
  }else{postMirrorBoost*=0.97}

  // Mirror word rendering
  if(activeMirrorWord){
    const age=t-activeMirrorWord.t;
    const fadeIn=Math.min(age/0.3,1);
    const fadeOut=Math.max(0,1-(age-activeMirrorWord.dur+0.5)/0.5);
    const alpha=Math.min(fadeIn,fadeOut)*0.85;
    if(alpha>0){
      const el=document.getElementById('mirrorWord');
      el.textContent=activeMirrorWord.word;
      el.style.color=`rgba(180,210,240,${alpha})`;
      el.style.textShadow=`0 0 40px rgba(100,150,220,${alpha*0.5})`;
    }
  }else{document.getElementById('mirrorWord').style.color='rgba(180,210,240,0)'}

  // VX: Ripples at first tide crest (33s)
  if(t>=33&&!firstTideFired){firstTideFired=true;spawnRipple(cx,cy,0.9)}
  // Ripple at drop (185.5s)
  if(DROPS.length>0&&t>=DROPS[0].t&&t<DROPS[0].t+0.5&&!DROPS[0].fired){
    DROPS[0].fired=true;spawnRipple(cx,cy,1.0);
    // VX: Haptic wave on drop
    try{navigator.vibrate&&navigator.vibrate([30,20,30,20,30,20,30])}catch(ex){}
  }
  drawRipples();

  // VX SYSTEM 5: Draw Bindu Memory constellation
  if(binduMemory.length>0){
    ctx.save();
    for(let i=0;i<binduMemory.length;i++){
      const m=binduMemory[i];
      const pos=wordToPosition(m.word);
      const age=(Date.now()-m.timestamp)/(1000*60*60*24*30); // months
      const alpha=Math.max(0.08,0.4/(1+age*0.5));
      // Check for repeated words (brighter)
      const count=binduMemory.filter(b=>b.word.toLowerCase()===m.word.toLowerCase()).length;
      const brightness=Math.min(0.6,alpha*count);
      ctx.globalAlpha=brightness*(0.8+Math.sin(t*0.3+i)*0.2);
      ctx.fillStyle=hsl(BINDU_HUE+i*7,30,70,1);
      ctx.beginPath();ctx.arc(pos.x*W,pos.y*HT,1.5+count*0.5,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  // Process hits
  while(hi<H.length&&t>=H[hi].t){
    const h=H[hi];
    if(t-h.t<0.4){
      spawnRing(h.i,bindu.x,bindu.y);
      bindu.ds=1+h.i*0.6;
      if(bloom>0.5&&h.i>0.35)spawnParticles(bindu.x,bindu.y,Math.floor(h.i*8),BINDU_HUE,h.i);
      if(h.i>0.4&&eb>0.3&&gaia.p>0.1)spawnGaiaRing(gaia.x,gaia.y,h.i*eb);
      // VX: Wavelike haptics (not punchy)
      if(h.i>0.6)try{navigator.vibrate&&navigator.vibrate([20,15,20])}catch(ex){}
    }
    hi++;
  }

  // ============================================================
  // ENSEMBLE POSITIONS — FULL SCREEN FLOW — height of creativity
  // ============================================================
  // VX: Gravity shift from gyroscope
  const gyroX=gyroActive?(gyroGamma||0)/45*maxR*0.25*wp.fluidity:0;
  const gyroY=gyroActive?((gyroBeta||0)-45)/45*maxR*0.2*wp.fluidity:0;

  // VX: Bindu SWEEPS — wide elliptical orbit that covers the screen
  const orbitR=maxR*0.35*tidePhase;
  const binduSwayX=Math.sin(t*0.7)*maxR*0.08*eh; // violin shimmer
  bindu.ty=cy+Math.sin(orbitAngle)*orbitR*0.8-(pi-0.5)*maxR*0.25+gyroY;
  bindu.tx=cx+Math.cos(orbitAngle)*orbitR*1.2+binduSwayX+gyroX;
  bindu.x+=(bindu.tx-bindu.x)*0.06;
  bindu.y+=(bindu.ty-bindu.y)*0.06;

  // Gaia — sweeps the bottom, WIDE horizontal, bass-driven
  gaia.tp=bloom>0.1?Math.min((bloom-0.1)/0.12,1):0;
  gaia.tx=cx+Math.sin(t*0.35)*maxR*0.8*eb+Math.cos(t*0.18)*maxR*0.3+gyroX;
  gaia.ty=cy+HT*0.2+Math.sin(t*0.15)*maxR*0.15+eb*maxR*0.1+gyroY*0.6;
  gaia.x+=(gaia.tx-gaia.x)*0.05;gaia.y+=(gaia.ty-gaia.y)*0.05;
  gaia.p+=(gaia.tp-gaia.p)*0.04;gaia.r=5+eb*4;

  // Sid — FULL ORBIT, wide and steady, the banks of the river
  sid.tp=bloom>0.18?Math.min((bloom-0.18)/0.12,1):0;
  sid.oA+=0.012+e*0.005;
  sid.tx=cx+Math.cos(sid.oA)*maxR*0.55+gyroX*0.5;
  sid.ty=cy+Math.sin(sid.oA)*maxR*0.45+gyroY*0.5;
  sid.x+=(sid.tx-sid.x)*0.04;sid.y+=(sid.ty-sid.y)*0.04;
  sid.p+=(sid.tp-sid.p)*0.04;

  // Arch — mirror at FULL distance, the violin's own dancer
  arch.tp=bloom>0.25?Math.min((bloom-0.25)/0.12,1):0;
  arch.tx=cx-(bindu.x-cx)*1.4+Math.sin(t*0.5)*maxR*0.15+gyroX*0.6;
  arch.ty=cy-(bindu.y-cy)*0.8+Math.cos(t*0.4)*em*maxR*0.2+gyroY*0.6;
  arch.x+=(arch.tx-arch.x)*0.06;arch.y+=(arch.ty-arch.y)*0.06;
  arch.p+=(arch.tp-arch.p)*0.04;arch.r=4.5+em*3;

  // Karishma — in silence she BLOOMS across the entire screen
  const kE=Math.max(0,1-e*1.3);
  karishma.tp=kE;
  karishma.tx=cx+Math.sin(t*0.2)*maxR*0.7*kE+Math.cos(t*0.13)*maxR*0.3+gyroX*0.4;
  karishma.ty=cy+Math.cos(t*0.17)*maxR*0.5*kE-maxR*0.1+gyroY*0.4;
  karishma.x+=(karishma.tx-karishma.x)*0.03;karishma.y+=(karishma.ty-karishma.y)*0.03;
  karishma.p+=(karishma.tp-karishma.p)*0.025;karishma.r=4+kE*5;

  // Sakshi — edge to edge, full screen presence
  sakshi.tp=bloom>0.35?Math.min((bloom-0.35)/0.15,1):0;
  sakshi.tx=cx+Math.cos(t*0.09)*maxR*0.9+gyroX*0.2;
  sakshi.ty=cy+Math.sin(t*0.07)*maxR*0.7+gyroY*0.2;
  sakshi.x+=(sakshi.tx-sakshi.x)*0.02;sakshi.y+=(sakshi.ty-sakshi.y)*0.02;
  sakshi.p+=(sakshi.tp-sakshi.p)*0.025;

  // Ashrey — centroid
  ashrey.tp=bloom>0.65?Math.min((bloom-0.65)/0.15,1):0;
  let ax=0,ay=0,n=0;
  for(const d of AD){if(d!==ashrey&&d.p>0.1){ax+=d.x;ay+=d.y;n++}}
  if(n>0){ashrey.tx=ax/n;ashrey.ty=ay/n}
  ashrey.x+=(ashrey.tx-ashrey.x)*0.03;ashrey.y+=(ashrey.ty-ashrey.y)*0.03;
  ashrey.p+=(ashrey.tp-ashrey.p)*0.02;
  ashrey.hue=(t*12)%360;

  // VX SYSTEM 7: ADAPTIVE RETURN — condition-based evaporation
  const isEnding=t>DUR*0.85&&e<0.15;
  const isSettling=accelSmoothed<0.3;
  const timeToEnd=DUR-t;

  if(timeToEnd<RETURN_START||(isEnding&&isSettling&&timeToEnd<30)){
    const rt=Math.min(timeToEnd,RETURN_START);
    const progress=1-rt/RETURN_START;
    // EVAPORATION: everything rises and fades (not descends)
    const liftY=-HT*0.3*progress;
    for(const d of AD){
      if(d!==bindu)d.ty+=liftY*0.5;
    }
    bindu.ty+=liftY*0.3;
    // Fade ensemble upward
    if(rt<15)ashrey.tp=Math.min(ashrey.tp,rt/15);
    if(rt<13)sakshi.tp=Math.min(sakshi.tp,(rt-2)/11);
    if(rt<11)arch.tp=Math.min(arch.tp,(rt-4)/7);
    if(rt<9)sid.tp=Math.min(sid.tp,(rt-6)/3);
    if(rt<7)gaia.tp=Math.min(gaia.tp,(rt-8)/2);
    if(rt<3)karishma.tp=Math.min(karishma.tp,rt/3);
  }

  // Update ghosts
  for(const d of AD)d.updateGhost();

  // Organism layer — bass pulse
  const bassPulse=eb*0.025;
  if(bassPulse>0.005){
    ctx.save();ctx.translate(cx,cy);ctx.scale(1+bassPulse,1+bassPulse);ctx.translate(-cx,-cy);
  }

  // Vignette
  const vigR=Math.max(W,HT)*(0.6+e*0.3);
  const vig=ctx.createRadialGradient(cx,cy,vigR*0.3,cx,cy,vigR);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,`rgba(0,0,0,${0.2+bloom*0.15})`);
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,HT);

  // CURRENT FIELD — subtle background flowing streams
  if(bloom>0.1){
    ctx.save();
    const cfAlpha=Math.min(bloom*0.12,0.08)*(1+postMirrorBoost);
    const nStreams=6;
    for(let i=0;i<nStreams;i++){
      const yBase=HT*(0.1+i*0.15);
      const drift=t*15*(0.3+i*0.1)*(i%2?1:-1)+gyroX*2;
      ctx.globalAlpha=cfAlpha*(0.5+Math.sin(t*0.2+i)*0.5);
      ctx.strokeStyle=hsl(BINDU_HUE+i*5,25,50,1);
      ctx.lineWidth=0.5;
      ctx.beginPath();
      for(let x=0;x<W;x+=8){
        const wave=Math.sin((x+drift)*0.008+i*1.1)*HT*0.03*(1+e*0.5)+
                   Math.sin((x+drift)*0.003+i*0.7)*HT*0.02;
        const yy=yBase+wave+gyroY*0.5;
        x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // Gaia impact rings
  for(let i=gaiaRings.length-1;i>=0;i--){
    const gr=gaiaRings[i];
    gr.r+=2;const life=gr.r/gr.mr;
    if(life>=1){gaiaRings.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=gr.op*(1-life)*(1+postMirrorBoost);
    ctx.strokeStyle=hsl(200,40,50,1);ctx.lineWidth=2*(1-life);
    ctx.beginPath();ctx.arc(gr.x,gr.y,gr.r,0,Math.PI*2);ctx.stroke();ctx.restore();
  }

  // WATER CURRENTS — flowing bezier curves that stream through the field (replaces orbital rings)
  if(bloom>0.2){
    orbitalBase+=0.001+e*0.003;
    const nCurrents=Math.min(Math.floor((bloom-0.2)*15),8);
    const curAlpha=(bloom-0.2)*0.35*(1+postMirrorBoost);
    ctx.save();
    for(let i=0;i<nCurrents;i++){
      const phase=orbitalBase*(0.5+i*0.2)*(i%2?-1:1);
      const spread=maxR*(0.3+i*0.08)*(0.4+e*0.6);
      const waveAmp=maxR*0.15*(1+eh*0.5);
      // Each current is a flowing bezier from one side through Bindu to the other
      const startA=phase+i*Math.PI*2/nCurrents;
      const sx=bindu.x+Math.cos(startA)*spread;
      const sy=bindu.y+Math.sin(startA)*spread;
      const ex=bindu.x+Math.cos(startA+Math.PI)*spread;
      const ey=bindu.y+Math.sin(startA+Math.PI)*spread;
      // Control points create the flowing curve
      const cp1x=bindu.x+Math.sin(t*0.3+i*1.1)*waveAmp;
      const cp1y=bindu.y+Math.cos(t*0.25+i*0.8)*waveAmp;
      const cp2x=bindu.x+Math.cos(t*0.35+i*0.9)*waveAmp*0.7;
      const cp2y=bindu.y+Math.sin(t*0.28+i*1.2)*waveAmp*0.7;
      ctx.globalAlpha=curAlpha*(0.3+i*0.08);
      ctx.strokeStyle=hsl(BINDU_HUE+i*8-10,45,55+bloom*12,1);
      ctx.lineWidth=0.6+bloom*0.8;
      ctx.beginPath();ctx.moveTo(sx,sy);
      ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,ex,ey);
      ctx.stroke();
    }
    ctx.restore();
  }

  // MELODIC RIBBON — pitch contour as visible flowing ribbon behind Bindu (replaces radial rays)
  if(bloom>0.3&&bindu.aG.length>3){
    ctx.save();
    const ribbonAlpha=(bloom-0.3)*0.6*(1+postMirrorBoost);
    // Draw a smooth curve through Bindu's ghost positions
    const pts=bindu.aG;
    if(pts.length>4){
      // Variable width ribbon based on energy at each point
      for(let pass=0;pass<2;pass++){
        ctx.beginPath();
        ctx.globalAlpha=ribbonAlpha*(pass===0?0.08:0.25);
        const width=pass===0?maxR*0.06:maxR*0.015;
        for(let i=1;i<pts.length-1;i++){
          const prev=pts[i-1],curr=pts[i],next=pts[i+1];
          const progress=i/pts.length;
          const localE=progress*e;
          const perpX=-(next.y-prev.y);
          const perpY=(next.x-prev.x);
          const perpLen=Math.hypot(perpX,perpY)||1;
          const w=width*localE*(1+eh*0.5);
          const nx=perpX/perpLen*w;
          const ny=perpY/perpLen*w;
          if(i===1){ctx.moveTo(curr.x+nx,curr.y+ny)}
          else{
            const mx=(prev.x+curr.x)/2+nx;
            const my=(prev.y+curr.y)/2+ny;
            ctx.quadraticCurveTo(prev.x+nx,prev.y+ny,mx,my);
          }
        }
        // Return along bottom edge
        for(let i=pts.length-2;i>0;i--){
          const prev=pts[Math.min(i+1,pts.length-1)],curr=pts[i],next=pts[Math.max(i-1,0)];
          const progress=i/pts.length;
          const localE=progress*e;
          const perpX=-(next.y-prev.y);
          const perpY=(next.x-prev.x);
          const perpLen=Math.hypot(perpX,perpY)||1;
          const w=(pass===0?maxR*0.06:maxR*0.015)*localE*(1+eh*0.5);
          const nx=-perpX/perpLen*w;
          const ny=-perpY/perpLen*w;
          const mx=(prev.x+curr.x)/2+nx;
          const my=(prev.y+curr.y)/2+ny;
          ctx.quadraticCurveTo(prev.x+nx,prev.y+ny,mx,my);
        }
        ctx.closePath();
        const ribbonGrad=ctx.createLinearGradient(
          pts[0].x,pts[0].y,pts[pts.length-1].x,pts[pts.length-1].y);
        ribbonGrad.addColorStop(0,hsl(BINDU_HUE-15,50,55,0));
        ribbonGrad.addColorStop(0.5,hsl(BINDU_HUE,55,65,1));
        ribbonGrad.addColorStop(1,hsl(BINDU_HUE+15,45,70,0.3));
        ctx.fillStyle=ribbonGrad;ctx.fill();
      }
    }
    ctx.restore();
  }

  // Droplets — particles that drift downward like water drops, leaving streaks
  for(let i=particles.length-1;i>=0;i--){
    const pt=particles[i];
    pt.x+=pt.vx;pt.y+=pt.vy;
    pt.vx*=0.96;pt.vy=pt.vy*0.96+0.08; // gravity pull
    pt.life-=pt.decay;
    if(pt.life<=0){particles.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=pt.life*0.5*(1+postMirrorBoost);
    // Streak in direction of movement
    const streak=Math.hypot(pt.vx,pt.vy)*2;
    const sa=Math.atan2(pt.vy,pt.vx);
    ctx.strokeStyle=hsl(pt.hue+pt.life*20,45,65,1);
    ctx.lineWidth=pt.r*pt.life*0.8;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(pt.x,pt.y);
    ctx.lineTo(pt.x-Math.cos(sa)*streak,pt.y-Math.sin(sa)*streak);ctx.stroke();
    // Dot at head
    ctx.fillStyle=hsl(pt.hue,40,75,1);
    ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r*pt.life*0.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Draw all dancers
  for(const d of AD)d.draw(t,e,ed,tn);

  // WHIRLPOOL — spiral vortex at high bloom (replaces crown mandala)
  if(bloom>0.7){
    const wpAlpha=(bloom-0.7)*1.2*(1+postMirrorBoost);
    ctx.save();
    // Spiral arms
    const nArms=5;
    const spiralRot=t*0.12;
    for(let arm=0;arm<nArms;arm++){
      const armBase=spiralRot+arm*Math.PI*2/nArms;
      ctx.beginPath();
      ctx.globalAlpha=wpAlpha*0.2;
      ctx.strokeStyle=hsl(BINDU_HUE+arm*8,40,60+bloom*10,1);
      ctx.lineWidth=0.5+bloom*0.5;
      for(let s=0;s<60;s++){
        const progress=s/60;
        const r=maxR*(0.02+progress*0.35)*(0.6+e*0.4);
        const a=armBase+progress*Math.PI*3; // 1.5 full turns
        const wobble=Math.sin(t*1.5+s*0.3)*maxR*0.01*progress;
        const x=bindu.x+Math.cos(a)*(r+wobble);
        const y=bindu.y+Math.sin(a)*(r+wobble);
        s===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    // Center vortex glow
    ctx.globalAlpha=wpAlpha*0.1;
    const vGrad=ctx.createRadialGradient(bindu.x,bindu.y,0,bindu.x,bindu.y,maxR*0.15);
    vGrad.addColorStop(0,hsl(BINDU_HUE,50,80,0.4));
    vGrad.addColorStop(1,hsl(BINDU_HUE,50,60,0));
    ctx.fillStyle=vGrad;ctx.beginPath();ctx.arc(bindu.x,bindu.y,maxR*0.15,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Expanding rings
  const now=performance.now();
  for(let i=rings.length-1;i>=0;i--){
    const rn=rings[i];
    rn.r+=rn.spd/60;const life=rn.r/rn.mr;
    if(life>=1){rings.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=rn.op*(1-life*life)*(1+postMirrorBoost);
    ctx.strokeStyle=hsl(BINDU_HUE,50,55+bloom*20,1);
    ctx.lineWidth=rn.lw*(1-life*0.6);
    ctx.beginPath();
    const sg=48;
    for(let s=0;s<=sg;s++){
      const a=(s/sg)*Math.PI*2;
      // Heavy wobble — water surface distortion
      const w=1+Math.sin(a*5+now*0.002)*0.06*(1-life)+Math.sin(a*3-now*0.001)*0.04*(1-life);
      const rx=rn.x+Math.cos(a)*rn.r*w;
      const ry=rn.y+Math.sin(a)*rn.r*w;
      s===0?ctx.moveTo(rx,ry):ctx.lineTo(rx,ry);
    }
    ctx.stroke();ctx.restore();
  }

  // Ashrey web
  if(ashrey.p>0.1){
    const viD=AD.filter(d=>d.p>0.1&&d!==ashrey);
    for(let i=0;i<viD.length;i++){
      for(let j=i+1;j<viD.length;j++){
        const d1=viD[i],d2=viD[j];
        const dist=Math.hypot(d1.x-d2.x,d1.y-d2.y);
        if(dist<maxR*1.5){
          const a=ashrey.p*0.15*(1-dist/(maxR*1.5))*(1+postMirrorBoost);
          ctx.save();ctx.globalAlpha=a;
          const wg=ctx.createLinearGradient(d1.x,d1.y,d2.x,d2.y);
          wg.addColorStop(0,hsl(d1.hue||BINDU_HUE,40,60,1));
          wg.addColorStop(1,hsl(d2.hue||BINDU_HUE,40,60,1));
          ctx.strokeStyle=wg;ctx.lineWidth=0.7;
          ctx.beginPath();ctx.moveTo(d1.x,d1.y);ctx.lineTo(d2.x,d2.y);ctx.stroke();
          const mx=(d1.x+d2.x)/2,my=(d1.y+d2.y)/2;
          ctx.globalAlpha=a*0.6;ctx.fillStyle=hsl(ashrey.hue,40,70,1);
          ctx.beginPath();ctx.arc(mx,my,1.5,0,Math.PI*2);ctx.fill();
          ctx.restore();
        }
      }
    }
  }

  // Resonance flashes
  for(let i=0;i<AD.length;i++){
    for(let j=i+1;j<AD.length;j++){
      if(AD[i].p>0.1&&AD[j].p>0.1){
        const dist=Math.hypot(AD[i].x-AD[j].x,AD[i].y-AD[j].y);
        if(dist<maxR*0.15){
          const mx=(AD[i].x+AD[j].x)/2,my=(AD[i].y+AD[j].y)/2;
          ctx.save();ctx.globalAlpha=0.5*(1+postMirrorBoost);
          const rg=ctx.createRadialGradient(mx,my,0,mx,my,maxR*0.12);
          rg.addColorStop(0,hsl(BINDU_HUE,30,90,0.6));rg.addColorStop(1,hsl(BINDU_HUE,30,90,0));
          ctx.fillStyle=rg;ctx.beginPath();ctx.arc(mx,my,maxR*0.12,0,Math.PI*2);ctx.fill();ctx.restore();
        }
      }
    }
  }

  // Close organism layer
  if(bassPulse>0.005)ctx.restore();

  // Word reveal at peak
  if(t>=PEAK_T&&!wordRevealed){
    wordRevealed=true;
    const wr=document.getElementById('wordReveal');
    wr.textContent=userWord;
    wr.classList.add('visible');
    setTimeout(()=>wr.classList.add('dissolve'),3500);
  }

  // I Love You
  if(t>PEAK_T+5&&!loveShown){loveShown=true;document.getElementById('loveText').classList.add('visible')}

  // Binaural return
  if(t>DUR-5)fadeBinaural(false);

  // End fade — to deep water, not black
  if(t>DUR-3){
    const f=Math.min((t-(DUR-3))/3,1);
    ctx.save();ctx.globalAlpha=f;
    ctx.fillStyle=hsl(BINDU_HUE,30,4,1);
    ctx.fillRect(0,0,W,HT);ctx.restore();
  }

  if(song.ended||t>DUR-0.3){
    if(!fruitShown){
      fruitShown=true;
      const w=userWord;
      const dwell=Math.round((Date.now()-wordStartTime)/1000*10)/10;
      const echo=getMostRepeated();

      // VX SYSTEM 9: ALIVE FRUIT
      let dwellMsg='';
      if(dwell<1.5)dwellMsg='You knew immediately.';
      else if(dwell<5)dwellMsg='You waited.';
      else dwellMsg='You searched before you could name it.';

      const countMsg=danceCount===0?'This is your first dance.':
        `This is your ${danceCount+1}${danceCount===0?'st':danceCount===1?'nd':danceCount===2?'rd':'th'} dance.`;

      const echoMsg=echo&&echo!==w.toLowerCase()?` You keep returning to \u201C${echo}.\u201D`:'';

      document.getElementById('fruitText').innerHTML=
        `There are no lyrics because you didn\u2019t need language to feel. Before your first word, you already knew joy, fear, warmth, cold. The violin is your body remembering what it knew before your mind took over. ${dwellMsg} ${motionLabel==='still'?'You were still.':motionLabel==='swaying'?'You were swaying.':'You were moving.'} ${countMsg}${echoMsg} Trust what you felt just now. It was more accurate than anything you could say about it.`;

      // Save to Bindu Memory
      saveToBinduMemory(w,dwell,motionLabel);
      // Cross-panel state
      try{localStorage.setItem('tol-svadhisthana-dance','true');localStorage.setItem('tol-svadhisthana-dance-word',w)}catch(ex){}
      setTimeout(()=>{
        document.getElementById('fruitOverlay').style.background=hsl(BINDU_HUE,30,4,1);
        document.getElementById('fruitOverlay').classList.add('visible');
      },2500);
    }
  }

  requestAnimationFrame(animate);
}

// ============================================================
// START
// ============================================================
function go(){
  if(started)return;
  const wi=document.getElementById('wordInput');
  userWord=wi.value.trim();
  if(!userWord){wi.focus();return}
  started=true;
  wi.blur();
  wordStartTime=Date.now();

  // VX: Set word-seeded params
  wp=wordParams(userWord);
  // VX: Generate mirror words from offering
  setupMirrorWords(userWord);

  // Fullscreen
  try{const el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()}catch(e){}

  // VX: Init device sensors
  initGyro();

  // Start binaural
  startBinaural();

  document.getElementById('wi').classList.remove('visible');
  document.getElementById('so').classList.add('hidden');
  clearTimeout(seedTimer);

  const song=document.getElementById('song');
  song.volume=0;

  setTimeout(()=>{
    song.play().then(()=>{
      function waitForAudio(){
        if(song.currentTime>0){
          hi=0;while(hi<H.length&&H[hi].t<song.currentTime-0.05)hi++;
          let v=0;const fi=setInterval(()=>{v=Math.min(v+0.01,0.8);song.volume=v;if(v>=0.8)clearInterval(fi)},50);
          fadeBinaural(true);
          requestAnimationFrame(animate);
        }else requestAnimationFrame(waitForAudio);
      }
      waitForAudio();
    }).catch(console.error);
  },3000);

  // Wake Lock
  (async()=>{try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}})();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')try{navigator.wakeLock.request('screen').then(w=>{wakeLock=w})}catch(e){}});
}

// Show word input after seed types
setTimeout(()=>document.getElementById('wi').classList.add('visible'),SEED.length*857+1500);

// Tap anywhere
document.addEventListener('touchend',e=>{
  if(!started&&document.getElementById('wi').classList.contains('visible')){go()}
},{passive:true});
document.addEventListener('click',()=>{
  if(!started&&document.getElementById('wi').classList.contains('visible'))go();
});
document.getElementById('wordInput').addEventListener('keydown',e=>{if(e.key==='Enter')go()});


</script>
