<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Chakra Game</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="chakra-data.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

@keyframes breathe {
  0%,100% { transform: scale(1);    opacity: 0.82; }
  50%      { transform: scale(1.07); opacity: 1;    }
}
@keyframes emerge {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0);    }
}
@keyframes fade-in {
  from { opacity: 0; } to { opacity: 1; }
}
@keyframes spin-slow {
  from { transform: rotate(0deg); } to { transform: rotate(360deg); }
}
@keyframes spin-rev {
  from { transform: rotate(0deg); } to { transform: rotate(-360deg); }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25%      { transform: translateX(-5px); }
  75%      { transform: translateX(5px); }
}
@keyframes glow-in {
  from { opacity: 0; transform: scale(0.88); }
  to   { opacity: 1; transform: scale(1);    }
}

html, body { height: 100%; }
body {
  background: #030206;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Sans', sans-serif;
}

/* ── Phone shell ── */
.ph-wrap { padding: 24px; display: flex; align-items: center; justify-content: center; }
.ph-body {
  width: 390px; height: 844px;
  background: #0E0C14;
  border-radius: 52px;
  position: relative;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 40px 100px rgba(0,0,0,0.9),
    inset 0 0 0 1px rgba(255,255,255,0.04);
  flex-shrink: 0;
}
/* Side buttons */
.ph-body::before {
  content: '';
  position: absolute; left: -3px; top: 160px;
  width: 3px; height: 44px;
  background: #1a1820; border-radius: 2px 0 0 2px;
  box-shadow: 0 60px 0 #1a1820, 0 108px 0 #1a1820;
}
.ph-body::after {
  content: '';
  position: absolute; right: -3px; top: 194px;
  width: 3px; height: 76px;
  background: #1a1820; border-radius: 0 2px 2px 0;
}
.ph-screen {
  position: absolute;
  inset: 10px;
  border-radius: 43px;
  overflow: hidden;
  background: #06040A;
  isolation: isolate;
}
.ph-island {
  position: absolute; top: 13px; left: 50%; transform: translateX(-50%);
  width: 126px; height: 36px;
  background: #000;
  border-radius: 20px;
  z-index: 200;
}
.ph-content {
  position: absolute;
  inset: 0;
  top: 58px;          /* below dynamic island */
  overflow: hidden;
}

/* scrollbar hide */
.ph-content ::-webkit-scrollbar { display: none; }

/* textarea reset */
textarea {
  -webkit-appearance: none;
  font-family: inherit;
}
textarea::placeholder { color: rgba(240,232,220,0.22); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="chakra-experiences.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ═══════════════════════════════════════════════════
   STARFIELD
═══════════════════════════════════════════════════ */
function Starfield({ count = 90, color = '#ffffff', baseOpacity = 0.45 }) {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current;
    if (!c) return;
    const ctx = c.getContext('2d');
    c.width  = c.offsetWidth;
    c.height = c.offsetHeight;
    const stars = Array.from({ length: count }, () => ({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      r: Math.random() * 1.2 + 0.2,
      phase: Math.random() * Math.PI * 2,
    }));
    let raf, t = 0;
    function draw() {
      ctx.clearRect(0, 0, c.width, c.height);
      stars.forEach(s => {
        const a = baseOpacity * (0.4 + 0.6 * Math.sin(s.phase + t * 0.4));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.globalAlpha = a;
        ctx.fill();
      });
      t += 0.016; raf = requestAnimationFrame(draw);
    }
    draw();
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={ref} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none' }} />;
}

/* ═══════════════════════════════════════════════════
   SACRED GEOMETRY (portal background)
═══════════════════════════════════════════════════ */
function SacredGeometry({ color }) {
  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none' }}>
      <svg viewBox="0 0 400 400" style={{
        position: 'absolute', inset: 0, width: '100%', height: '100%', opacity: 0.13,
        animation: 'spin-slow 80s linear infinite',
      }}>
        {[32, 68, 104, 140, 176].map((r, i) => (
          <circle key={i} cx="200" cy="200" r={r} fill="none" stroke={color} strokeWidth="0.6" />
        ))}
        {Array.from({ length: 12 }, (_, i) => {
          const a = (i * 30 * Math.PI) / 180;
          return <line key={i} x1="200" y1="200" x2={200 + 176 * Math.cos(a)} y2={200 + 176 * Math.sin(a)} stroke={color} strokeWidth="0.4" />;
        })}
      </svg>
      <svg viewBox="0 0 400 400" style={{
        position: 'absolute', inset: 0, width: '100%', height: '100%', opacity: 0.06,
        animation: 'spin-rev 50s linear infinite',
      }}>
        {[56, 112, 168].map((r, i) => (
          <circle key={i} cx="200" cy="200" r={r} fill="none" stroke={color} strokeWidth="0.5" strokeDasharray="4 8" />
        ))}
      </svg>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   HOME SCREEN
═══════════════════════════════════════════════════ */
function HomeScreen({ onSelect }) {
  const chakras = window.CHAKRA_DATA;
  return (
    <div style={{
      width: '100%', height: '100%',
      background: 'linear-gradient(185deg, #060310 0%, #090512 55%, #050308 100%)',
      position: 'relative', overflow: 'hidden', display: 'flex', flexDirection: 'column',
    }}>
      <Starfield count={130} baseOpacity={0.5} />

      {/* Title block */}
      <div style={{
        textAlign: 'center', padding: '32px 0 20px', position: 'relative', zIndex: 10,
        animation: 'emerge 1s ease both',
      }}>
        <div style={{
          fontFamily: "'DM Sans', sans-serif",
          fontSize: '10px', letterSpacing: '0.42em', textTransform: 'uppercase',
          color: 'rgba(200,185,240,0.35)', marginBottom: '8px',
        }}>a sacred cookbook for</div>
        <div style={{
          fontFamily: "'Cormorant Garamond', serif",
          fontSize: '46px', letterSpacing: '0.22em', fontWeight: 300,
          color: 'rgba(240,232,222,0.94)', lineHeight: 1,
        }}>REALITY</div>
      </div>

      {/* Spine */}
      <div style={{ flex: 1, position: 'relative', zIndex: 10 }}>
        {/* Vertical sushumna line */}
        <div style={{
          position: 'absolute', left: '50%', top: '10px', bottom: '10px', width: '1px',
          background: 'linear-gradient(to bottom, transparent, rgba(180,155,230,0.22) 15%, rgba(180,155,230,0.22) 85%, transparent)',
          transform: 'translateX(-50%)',
        }} />

        {/* Chakra orbs — reversed so Crown is at top */}
        <div style={{
          position: 'absolute', inset: 0,
          display: 'flex', flexDirection: 'column',
          justifyContent: 'space-around', alignItems: 'center',
          padding: '8px 0',
        }}>
          {[...chakras].reverse().map((ch, idx) => (
            <ChakraOrb key={ch.id} chakra={ch} delay={idx * 0.07} onSelect={onSelect} />
          ))}
        </div>
      </div>

      {/* Footer mantra */}
      <div style={{
        textAlign: 'center', padding: '12px 0 24px',
        fontFamily: "'Cormorant Garamond', serif",
        fontSize: '11px', letterSpacing: '0.3em',
        color: 'rgba(200,185,240,0.22)', position: 'relative', zIndex: 10,
      }}>
        Love · Knowledge · Will · Action
      </div>
    </div>
  );
}

function ChakraOrb({ chakra, delay, onSelect }) {
  const [pressed, setPressed] = useState(false);
  return (
    <button onClick={() => onSelect(chakra)}
      onMouseEnter={() => setPressed(true)} onMouseLeave={() => setPressed(false)}
      onTouchStart={() => setPressed(true)} onTouchEnd={() => setPressed(false)}
      style={{
        background: 'none', border: 'none', cursor: 'pointer',
        display: 'flex', alignItems: 'center', gap: '14px',
        padding: '4px 28px', width: '100%', justifyContent: 'center',
        animation: `emerge 0.55s ${delay}s ease both`,
      }}>
      {/* Orb */}
      <div style={{
        width: '34px', height: '34px', borderRadius: '50%', flexShrink: 0,
        background: `radial-gradient(circle at 36% 34%, ${chakra.accent}70, ${chakra.color}80)`,
        boxShadow: `0 0 ${pressed ? 22 : 12}px ${chakra.color}70, 0 0 ${pressed ? 44 : 24}px ${chakra.color}28`,
        animation: `breathe ${3.8 + delay * 0.6}s ${delay * 0.9}s ease-in-out infinite`,
        transition: 'box-shadow 0.3s',
      }} />
      {/* Text */}
      <div style={{ textAlign: 'left', width: '148px' }}>
        <div style={{
          fontFamily: "'Cormorant Garamond', serif", fontSize: '20px', fontWeight: 400,
          color: pressed ? chakra.accent : 'rgba(240,232,222,0.82)', lineHeight: 1.15,
          transition: 'color 0.2s',
        }}>{chakra.title}</div>
        <div style={{
          fontSize: '10px', letterSpacing: '0.22em', textTransform: 'uppercase', marginTop: '1px',
          color: 'rgba(200,185,240,0.28)',
        }}>{chakra.theme} · {chakra.element}</div>
      </div>
      {/* Number */}
      <div style={{
        fontFamily: "'Cormorant Garamond', serif", fontSize: '12px',
        color: 'rgba(200,185,240,0.20)', width: '14px', flexShrink: 0,
      }}>{chakra.num}</div>
    </button>
  );
}

/* ═══════════════════════════════════════════════════
   PORTAL SCREEN
═══════════════════════════════════════════════════ */
function PortalScreen({ chakra, onEnter, onBack }) {
  const [ready, setReady] = useState(false);
  useEffect(() => { const t = setTimeout(() => setReady(true), 120); return () => clearTimeout(t); }, []);

  return (
    <div style={{
      width: '100%', height: '100%', background: chakra.bg,
      position: 'relative', overflow: 'hidden',
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
    }}>
      <SacredGeometry color={chakra.color} />

      {/* Back */}
      <button onClick={onBack} style={{
        position: 'absolute', top: '14px', left: '22px', zIndex: 20,
        background: 'none', border: 'none', cursor: 'pointer',
        fontFamily: "'DM Sans', sans-serif", fontSize: '11px',
        letterSpacing: '0.2em', color: `${chakra.accent}50`, textTransform: 'uppercase',
      }}>← Back</button>

      {/* Content */}
      <div style={{
        position: 'relative', zIndex: 10, textAlign: 'center', padding: '32px 36px',
        opacity: ready ? 1 : 0, transition: 'opacity 0.6s ease',
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '6px',
      }}>
        {/* Mantra + Element */}
        <div style={{
          fontFamily: "'DM Sans', sans-serif", fontSize: '10px',
          letterSpacing: '0.38em', color: `${chakra.color}80`, textTransform: 'uppercase', marginBottom: '6px',
        }}>{chakra.mantra} · {chakra.element}</div>

        {/* Name */}
        <div style={{
          fontFamily: "'Cormorant Garamond', serif", fontSize: '48px',
          fontWeight: 300, letterSpacing: '0.06em', lineHeight: 1.05,
          color: 'rgba(240,232,222,0.94)',
        }}>{chakra.name}</div>

        {/* Theme */}
        <div style={{
          fontFamily: "'Cormorant Garamond', serif", fontSize: '15px',
          letterSpacing: '0.26em', color: 'rgba(240,232,222,0.42)', marginBottom: '10px',
        }}>{chakra.theme}</div>

        {/* Orb */}
        <div style={{
          width: '108px', height: '108px', borderRadius: '50%', margin: '18px 0 22px',
          background: `radial-gradient(circle at 36% 34%, ${chakra.accent}55, ${chakra.color}80)`,
          boxShadow: `0 0 44px ${chakra.color}65, 0 0 90px ${chakra.color}28`,
          animation: 'breathe 4.5s ease-in-out infinite',
        }} />

        {/* Sacred text */}
        <p style={{
          fontFamily: "'Cormorant Garamond', serif", fontStyle: 'italic',
          fontSize: '16px', color: 'rgba(240,232,222,0.52)', lineHeight: 1.75,
          maxWidth: '272px', marginBottom: '20px',
        }}>"{chakra.sacredText}"</p>

        {/* Experience badge */}
        <div style={{
          display: 'inline-block', padding: '4px 14px', borderRadius: '20px',
          border: `1px solid ${chakra.color}45`, fontSize: '10px',
          letterSpacing: '0.22em', color: `${chakra.accent}80`, textTransform: 'uppercase',
          marginBottom: '22px',
        }}>{chakra.experienceLabel}</div>

        {/* Enter */}
        <button onClick={onEnter} style={{
          width: '200px', padding: '16px 0', borderRadius: '30px', cursor: 'pointer',
          background: `${chakra.color}1A`, border: `1px solid ${chakra.color}58`,
          fontFamily: "'Cormorant Garamond', serif", fontSize: '17px',
          letterSpacing: '0.22em', textTransform: 'uppercase',
          color: 'rgba(240,232,222,0.88)',
        }}>Enter</button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   EXPERIENCE ROUTER
═══════════════════════════════════════════════════ */
function ExperienceRouter({ chakra, onBack, onComplete }) {
  const map = {
    root:     window.RootExperience,
    sacral:   window.SacralExperience,
    solar:    window.SolarExperience,
    heart:    window.HeartExperience,
    throat:   window.ThroatExperience,
    thirdeye: window.ThirdEyeExperience,
    crown:    window.CrownExperience,
  };
  const Comp = map[chakra.id];
  return Comp ? <Comp chakra={chakra} onBack={onBack} onComplete={onComplete} /> : null;
}

/* ═══════════════════════════════════════════════════
   SCREEN TRANSITION WRAPPER
═══════════════════════════════════════════════════ */
function ScreenWrap({ children, id }) {
  return (
    <div key={id} style={{ width: '100%', height: '100%', animation: 'glow-in 0.4s ease both' }}>
      {children}
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   APP
═══════════════════════════════════════════════════ */
function App() {
  const [screen, setScreen]   = useState('home');
  const [chakra, setChakra]   = useState(null);
  const [transKey, setTransKey] = useState(0);

  function go(nextScreen, ch = null) {
    setScreen(nextScreen);
    if (ch) setChakra(ch);
    setTransKey(k => k + 1);
  }

  return (
    <div className="ph-wrap">
      <div className="ph-body">
        <div className="ph-screen">
          <div className="ph-island" />
          <div className="ph-content">
            {screen === 'home' && (
              <ScreenWrap id={transKey}>
                <HomeScreen onSelect={ch => go('portal', ch)} />
              </ScreenWrap>
            )}
            {screen === 'portal' && chakra && (
              <ScreenWrap id={transKey}>
                <PortalScreen
                  chakra={chakra}
                  onEnter={() => go('experience')}
                  onBack={() => go('home')}
                />
              </ScreenWrap>
            )}
            {screen === 'experience' && chakra && (
              <ScreenWrap id={transKey}>
                <ExperienceRouter
                  chakra={chakra}
                  onBack={() => go('portal')}
                  onComplete={() => go('home')}
                />
              </ScreenWrap>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
