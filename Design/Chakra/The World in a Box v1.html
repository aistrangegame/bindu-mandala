<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The World in a Box</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#060402;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
@keyframes emerge{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes firefly{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes gift-land{0%{opacity:0;transform:translateY(-40px) scale(.6)}60%{opacity:1;transform:translateY(3px) scale(1.05)}100%{transform:translateY(0) scale(1)}}
@keyframes drip{0%{opacity:0;transform:translateY(0)}30%{opacity:.7}100%{opacity:0;transform:translateY(16px)}}
.ph-wrap{padding:20px;display:flex;align-items:center;justify-content:center;}
.ph-body{width:390px;height:844px;background:#100A06;border-radius:52px;position:relative;flex-shrink:0;
  box-shadow:0 0 0 1px rgba(255,220,160,.06),0 40px 100px rgba(0,0,0,.92),inset 0 0 0 1px rgba(255,220,160,.04);}
.ph-body::before{content:'';position:absolute;left:-3px;top:160px;width:3px;height:44px;background:#1A1208;border-radius:2px 0 0 2px;box-shadow:0 60px 0 #1A1208,0 108px 0 #1A1208;}
.ph-body::after{content:'';position:absolute;right:-3px;top:194px;width:3px;height:76px;background:#1A1208;border-radius:0 2px 2px 0;}
.ph-screen{position:absolute;inset:10px;border-radius:43px;overflow:hidden;background:#050302;}
.ph-island{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:126px;height:36px;background:#000;border-radius:20px;z-index:200;}
.ph-content{position:absolute;inset:0;top:58px;overflow:hidden;}
.scroll{overflow-y:auto;}.scroll::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="root"></div>

<!-- ═══ A · WORLD DATA ═══ -->
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const safe = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };

const WSTORE = 'world_box_v1';
const getWorld = () => safe(WSTORE, {});
const setWorld = (d) => localStorage.setItem(WSTORE, JSON.stringify({ ...getWorld(), ...d }));

// Deterministic pseudo-random from a string key → 0..1
function hash01(str, salt) {
  let h = 2166136261 ^ (salt || 0);
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 10000) / 10000;
}

const GIFTS = [
  { kind:'pebble',  sym:'●', c:'#A89880', note:'a smooth pebble. it fits your hand exactly.' },
  { kind:'feather', sym:'⟋', c:'#D8C8A8', note:'a feather. something flew over while you were away.' },
  { kind:'acorn',   sym:'◉', c:'#B08048', note:'an acorn. an entire tree, being patient.' },
  { kind:'marble',  sym:'◎', c:'#80C8E8', note:'a marble with a whole sky inside it.' },
  { kind:'button',  sym:'✱', c:'#E8A870', note:'a button from a coat someone loved.' },
  { kind:'ribbon',  sym:'∿', c:'#E88098', note:'a ribbon that remembers being part of a gift.' },
  { kind:'key',     sym:'⚿', c:'#C8B060', note:'a small key. nobody knows what it opens yet.' },
  { kind:'shell',   sym:'◠', c:'#E8D8C0', note:'a shell that still hums the sea if you believe hard.' },
];

// Derive world items from every trace across the spaces
function deriveWorld() {
  const items = [];
  const sessions = safe('child_sessions_v1', {});
  const beads = safe('g108', []).length;
  const seedTs = (() => { try { const v = localStorage.getItem('game_seed_v1'); return v ? parseInt(v) : null; } catch { return null; } })();
  const letters = safe('correspondence_v2', []);
  const gates = safe('seven_gates_v1', {});
  const mirrors = safe('mirror_sessions_v1', []);
  const childSpace = safe('child_space_v1', {});
  const verses = safe('body_scripture_v1', []);

  const plantN = Math.min(sessions.garden || 0, 5);
  for (let i = 0; i < plantN; i++)
    items.push({ key:'plant'+i, sym:'✿', c:'#90C050', anim:'sway', big:i===0,
      note:'grew from your finger garden.' });

  if ((sessions.colours || 0) > 0)
    items.push({ key:'paint', sym:'◈', c:'#E08030', anim:'',
      note:'a stone stained every colour of the rivers you mixed.' });

  if ((sessions.rain || 0) > 0)
    items.push({ key:'cloud', sym:'☁', c:'#90B8D8', anim:'bob', sky:true,
      note:'a small cloud that followed you home from the rain.' });

  if ((sessions.echo || 0) > 0)
    items.push({ key:'drum', sym:'◉', c:'#D0A030', anim:'',
      note:'the echo lives in here. tap-tap. tap-tap.' });

  const flyN = Math.min(Math.floor(beads / 36), 3);
  for (let i = 0; i < flyN; i++)
    items.push({ key:'fly'+i, sym:'✦', c:'#F5DC80', anim:'firefly', tiny:true, sky:true,
      note:'a firefly — one appears for every 36 beads you touch.' });

  if (seedTs) {
    const hrs = (Date.now() - seedTs) / 3600000;
    const stage = hrs < 8 ? 'a sprout' : hrs < 72 ? 'a young tree' : 'a tree in bloom';
    items.push({ key:'tree', sym:'❦', c:'#5A9048', anim:'sway', big:true,
      note:`${stage} — the seed you planted, still growing.` });
  }

  const boatN = Math.min(letters.length, 3);
  for (let i = 0; i < boatN; i++)
    items.push({ key:'boat'+i, sym:'⌅', c:'#C0B0F8', anim:'bob',
      note:'a paper boat — one of your letters, sailing through time.' });

  const gateN = (gates.completions || 0) + ((gates.passed || []).length > 0 ? 1 : 0);
  for (let i = 0; i < Math.min(gateN, 2); i++)
    items.push({ key:'arch'+i, sym:'∩', c:'#A87888', anim:'', big:true,
      note:'a stone arch — you have walked the descent.' });

  if (mirrors.length > 0)
    items.push({ key:'pond', sym:'◍', c:'#A8C8D8', anim:'',
      note:`a still pond. you have met your own eyes ${mirrors.length} time${mirrors.length!==1?'s':''}.` });

  if (childSpace.promise?.text)
    items.push({ key:'flag', sym:'⚑', c:'#F0B85A', anim:'sway',
      note:'a small flag for the promise you are still keeping.' });

  const stoneN = Math.min(verses.length, 3);
  for (let i = 0; i < stoneN; i++)
    items.push({ key:'stone'+i, sym:'▲', c:'#B89078', tiny:true,
      note:'a carved stone — a verse your body spoke.' });

  // Collected gifts
  (getWorld().gifts || []).forEach((g, i) => {
    const meta = GIFTS.find(x => x.kind === g.kind) || GIFTS[0];
    items.push({ key:'gift-'+g.kind+'-'+i, sym:meta.sym, c:meta.c, tiny:true,
      note:meta.note, gift:true });
  });

  return items;
}

// Today's gift — one per calendar day
function checkDailyGift() {
  const w = getWorld();
  const today = new Date().toDateString();
  if (w.lastGift === today) return null;
  const gifts = w.gifts || [];
  const kind = GIFTS[Math.floor(hash01(today, 7) * GIFTS.length)].kind;
  setWorld({ lastGift: today, gifts: [...gifts, { kind, ts: Date.now() }].slice(-24) });
  return GIFTS.find(g => g.kind === kind);
}

Object.assign(window, { deriveWorld, checkDailyGift, getWorld, setWorld, hash01, GIFTS });
</script>

<!-- ═══ B · THE SCENE ═══ -->
<script type="text/babel">
const { useState:useSc, useEffect:useScE, useRef:useScR } = React;
const { hash01:H01 } = window;

// Sky palette by hour of local time
function skyColors(h) {
  if (h >= 5 && h < 8)   return ['#2A2038', '#7A4838', '#C08858'];   // dawn
  if (h >= 8 && h < 17)  return ['#4A6888', '#88A8B8', '#C8B888'];   // day
  if (h >= 17 && h < 20) return ['#38284A', '#8A4848', '#D89058'];   // dusk
  return ['#0A0818', '#141228', '#282038'];                          // night
}

function SceneCanvas() {
  const ref = useScR(null);
  useScE(() => {
    const cv = ref.current; if (!cv) return;
    const dpr = window.devicePixelRatio || 1;
    let raf;
    function draw() {
      if (cv.offsetWidth === 0) { raf = requestAnimationFrame(draw); return; }
      cv.width = cv.offsetWidth * dpr; cv.height = cv.offsetHeight * dpr;
      const ctx = cv.getContext('2d');
      const W = cv.width, H = cv.height;
      const hour = new Date().getHours() + new Date().getMinutes()/60;
      const night = hour < 5 || hour >= 20;
      const [top, mid, low] = skyColors(hour);

      // Sky
      const sky = ctx.createLinearGradient(0, 0, 0, H * .72);
      sky.addColorStop(0, top); sky.addColorStop(.65, mid); sky.addColorStop(1, low);
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H * .72);

      // Stars at night
      if (night) {
        for (let i = 0; i < 40; i++) {
          const x = H01('star'+i, 1) * W, y = H01('star'+i, 2) * H * .5;
          ctx.beginPath(); ctx.arc(x, y, (H01('star'+i,3)*1.2+.4)*dpr, 0, Math.PI*2);
          ctx.fillStyle = `rgba(240,235,220,${.25 + H01('star'+i,4)*.5})`; ctx.fill();
        }
        // Moon
        ctx.beginPath(); ctx.arc(W*.76, H*.16, 16*dpr, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(230,225,210,.85)'; ctx.shadowColor='#E8E0D0'; ctx.shadowBlur=22*dpr; ctx.fill();
        ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.arc(W*.76 - 6*dpr, H*.16 - 3*dpr, 14*dpr, 0, Math.PI*2);
        ctx.fillStyle = top; ctx.fill();
      } else {
        // Sun
        const sunX = W * (.15 + .7 * Math.max(0, Math.min(1, (hour - 6) / 13)));
        ctx.beginPath(); ctx.arc(sunX, H*.14, 15*dpr, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(250,225,160,.92)'; ctx.shadowColor='#F5D888'; ctx.shadowBlur=30*dpr; ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Far hill
      ctx.beginPath();
      ctx.ellipse(W*.28, H*.78, W*.62, H*.16, 0, Math.PI, 0);
      ctx.fillStyle = night ? '#141008' : '#3A2C18';
      ctx.fill(); ctx.fillRect(0, H*.78, W, H*.24);

      // Near hill
      ctx.beginPath();
      ctx.ellipse(W*.72, H*.86, W*.68, H*.15, 0, Math.PI, 0);
      ctx.fillStyle = night ? '#1A1408' : '#4A3820';
      ctx.fill(); ctx.fillRect(0, H*.86, W, H*.16);

      // Ground light pool
      const gp = ctx.createRadialGradient(W*.5, H*.86, 0, W*.5, H*.86, W*.4);
      gp.addColorStop(0, night ? 'rgba(240,200,120,.05)' : 'rgba(250,220,150,.10)');
      gp.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gp; ctx.fillRect(0, H*.6, W, H*.4);
    }
    draw();
    const id = setInterval(draw, 60000);
    return () => { clearInterval(id); cancelAnimationFrame(raf); };
  }, []);
  return <canvas ref={ref} style={{ position:'absolute', inset:0, width:'100%', height:'100%', display:'block' }}></canvas>;
}
Object.assign(window, { SceneCanvas });
</script>

<!-- ═══ C · THE WORLD + APP ═══ -->
<script type="text/babel">
const { useState:useW, useEffect:useWE, useRef:useWR } = React;
const { deriveWorld:DW, checkDailyGift:CDG, getWorld:GW, setWorld:SW, hash01:H, SceneCanvas:SC } = window;

function WorldView() {
  const [items, setItems] = useW(() => DW());
  const [gift, setGift] = useW(null);
  const [caption, setCaption] = useW(null);
  const [showKey, setShowKey] = useW(false);
  const [drag, setDrag] = useW(null);
  const sceneRef = useWR(null);

  // Daily gift arrives 1.2s after entering
  useWE(() => {
    const t = setTimeout(() => {
      const g = CDG();
      if (g) { setGift(g); setItems(DW()); }
    }, 1200);
    return () => clearTimeout(t);
  }, []);

  // Position: user override or deterministic default
  function posOf(it) {
    const ov = (GW().pos || {})[it.key];
    if (ov) return ov;
    if (it.sky) return { x: .12 + H(it.key, 1) * .72, y: .06 + H(it.key, 2) * .22 };
    return { x: .08 + H(it.key, 1) * .82, y: .58 + H(it.key, 2) * .30 };
  }

  function onDown(e, it) {
    e.stopPropagation();
    setDrag(it.key);
    setCaption({ key: it.key, note: it.note });
  }
  function onMove(e) {
    if (!drag) return;
    const r = sceneRef.current?.getBoundingClientRect(); if (!r) return;
    const src = e.touches ? e.touches[0] : e;
    const x = Math.max(.03, Math.min(.94, (src.clientX - r.left) / r.width));
    const y = Math.max(.03, Math.min(.92, (src.clientY - r.top) / r.height));
    SW({ pos: { ...(GW().pos || {}), [drag]: { x, y } } });
    setItems(its => [...its]);   // re-render
  }
  function onUp() { setDrag(null); }

  const empty = items.length === 0;

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:'#050302' }}
      onMouseMove={onMove} onMouseUp={onUp} onTouchMove={onMove} onTouchEnd={onUp}>

      <div style={{ padding:'10px 22px 6px', flexShrink:0, display:'flex',
        justifyContent:'space-between', alignItems:'baseline' }}>
        <p style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'20px',
          color:'rgba(240,184,90,.88)', letterSpacing:'.1em' }}>The World in a Box</p>
        <button onClick={() => setShowKey(k => !k)} style={{ background:'none', border:'none',
          cursor:'pointer', fontFamily:"'DM Sans',sans-serif", fontSize:'9px',
          letterSpacing:'.2em', textTransform:'uppercase', color:'rgba(240,184,90,.38)' }}>
          {showKey ? 'close' : 'how it grows'}
        </button>
      </div>

      {/* The diorama */}
      <div ref={sceneRef} style={{ flex:1, position:'relative', margin:'0 14px',
        borderRadius:'22px', overflow:'hidden',
        border:'1px solid rgba(240,184,90,.16)',
        boxShadow:'inset 0 0 40px rgba(0,0,0,.5), 0 0 30px rgba(196,120,32,.08)' }}>
        <SC/>

        {/* Items */}
        {items.map(it => {
          const p = posOf(it);
          const size = it.big ? 44 : it.tiny ? 22 : 32;
          return (
            <div key={it.key}
              onMouseDown={e => onDown(e, it)}
              onTouchStart={e => onDown(e, it)}
              style={{ position:'absolute',
                left:`calc(${p.x*100}% - ${size/2}px)`, top:`calc(${p.y*100}% - ${size/2}px)`,
                width:size+'px', height:size+'px', cursor:'grab',
                display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:(it.big ? 26 : it.tiny ? 13 : 19)+'px', color:it.c,
                textShadow:`0 0 10px ${it.c}90, 0 2px 4px rgba(0,0,0,.6)`,
                animation: it.anim ? `${it.anim} ${3+H(it.key,5)*2}s ease-in-out infinite` : 'none',
                userSelect:'none', touchAction:'none', zIndex: drag===it.key ? 20 : 5,
              }}>{it.sym}</div>
          );
        })}

        {/* Caption */}
        {caption && (
          <div onClick={() => setCaption(null)} style={{ position:'absolute', bottom:'12px',
            left:'14px', right:'14px', padding:'11px 16px', borderRadius:'14px',
            background:'rgba(8,5,2,.85)', border:'1px solid rgba(240,184,90,.22)',
            animation:'emerge .3s ease', cursor:'pointer', zIndex:30 }}>
            <p style={{ fontFamily:"'Cormorant Garamond',serif", fontStyle:'italic',
              fontSize:'14px', color:'rgba(245,232,212,.78)', lineHeight:1.6,
              textAlign:'center' }}>{caption.note}</p>
          </div>
        )}

        {/* Gift arrival */}
        {gift && (
          <div onClick={() => setGift(null)} style={{ position:'absolute', inset:0,
            background:'rgba(5,3,2,.72)', display:'flex', flexDirection:'column',
            alignItems:'center', justifyContent:'center', gap:'18px', cursor:'pointer',
            animation:'fade-in .6s ease', zIndex:40 }}>
            <div style={{ fontSize:'42px', color:gift.c,
              textShadow:`0 0 20px ${gift.c}`, animation:'gift-land 1s cubic-bezier(.3,1.3,.5,1) both' }}>
              {gift.sym}
            </div>
            <p style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'19px',
              color:'rgba(245,232,212,.88)', textAlign:'center', padding:'0 40px',
              lineHeight:1.6 }}>The world left you something.</p>
            <p style={{ fontFamily:"'Cormorant Garamond',serif", fontStyle:'italic',
              fontSize:'14px', color:'rgba(240,184,90,.55)', textAlign:'center',
              padding:'0 48px', lineHeight:1.7 }}>{gift.note}</p>
            <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:'9px',
              letterSpacing:'.24em', textTransform:'uppercase',
              color:'rgba(240,184,90,.30)' }}>tap to place it in the world</p>
          </div>
        )}

        {/* Empty state */}
        {empty && !gift && (
          <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column',
            alignItems:'center', justifyContent:'center', padding:'40px', textAlign:'center' }}>
            <p style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'19px',
              color:'rgba(245,232,212,.60)', lineHeight:1.7, marginBottom:'10px' }}>
              The world is waiting to be lived in.
            </p>
            <p style={{ fontFamily:"'Cormorant Garamond',serif", fontStyle:'italic',
              fontSize:'13px', color:'rgba(240,184,90,.40)', lineHeight:1.8 }}>
              Everything you do in the other spaces<br/>leaves something here.
            </p>
          </div>
        )}

        {/* Key overlay */}
        {showKey && (
          <div onClick={() => setShowKey(false)} className="scroll" style={{ position:'absolute',
            inset:0, background:'rgba(5,3,2,.90)', padding:'22px 26px', overflowY:'auto',
            animation:'fade-in .3s ease', cursor:'pointer', zIndex:50 }}>
            <p style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'19px',
              color:'rgba(245,232,212,.85)', marginBottom:'16px' }}>How the world grows</p>
            {[
              ['✿','#90C050','plants grow from the Finger Garden'],
              ['◈','#E08030','a painted stone from Colour Rivers'],
              ['☁','#90B8D8','a cloud follows you from The Rain'],
              ['◉','#D0A030','the drum holds The Echo'],
              ['✦','#F5DC80','a firefly per 36 beads of the 108'],
              ['❦','#5A9048','the tree is your planted Seed'],
              ['⌅','#C0B0F8','paper boats are your letters through time'],
              ['∩','#A87888','stone arches from the Seven Gates'],
              ['◍','#A8C8D8','the pond appears when you meet The Mirror'],
              ['⚑','#F0B85A','the flag flies for your promise'],
              ['▲','#B89078','carved stones are verses from your body'],
              ['●','#A89880','and each day you visit, the world leaves a gift'],
            ].map(([s, c, txt]) => (
              <div key={txt} style={{ display:'flex', gap:'12px', alignItems:'center', marginBottom:'9px' }}>
                <span style={{ fontSize:'15px', color:c, width:'20px', textAlign:'center',
                  textShadow:`0 0 8px ${c}60`, flexShrink:0 }}>{s}</span>
                <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:'14px',
                  color:'rgba(245,232,212,.62)', lineHeight:1.5 }}>{txt}</span>
              </div>
            ))}
            <p style={{ fontFamily:"'Cormorant Garamond',serif", fontStyle:'italic',
              fontSize:'12px', color:'rgba(240,184,90,.35)', marginTop:'14px',
              textAlign:'center' }}>tap to close</p>
          </div>
        )}
      </div>

      <p style={{ padding:'10px 0 14px', textAlign:'center', flexShrink:0,
        fontFamily:"'Cormorant Garamond',serif", fontStyle:'italic', fontSize:'12px',
        color:'rgba(240,184,90,.25)' }}>
        drag things where they belong · tap them to remember where they came from
      </p>
    </div>
  );
}

function App() {
  return (
    <div className="ph-wrap">
      <div className="ph-body">
        <div className="ph-screen">
          <div className="ph-island"></div>
          <div className="ph-content"><WorldView/></div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
