<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bindu · The Origin · Slice 1a</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:#0B0910;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;}
a{color:rgba(200,185,240,.55);} a:hover{color:rgba(220,210,248,.85);}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.07);opacity:1}}
@keyframes emerge{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes ember{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
@keyframes lift-away{0%{transform:translateY(0) scale(1);opacity:1}22%{transform:translateY(-14px) scale(.7);opacity:1}100%{transform:translateY(-78vh) scale(.18);opacity:0}}
@keyframes ripple{from{transform:scale(1);opacity:.8}to{transform:scale(5.5);opacity:0}}
@keyframes converge{0%{transform:scale(5);opacity:0}22%{opacity:.55}100%{transform:scale(.08);opacity:0}}
@keyframes zoom-in{from{transform:scale(1)}to{transform:scale(110)}}
@keyframes draw-in{to{stroke-dashoffset:0}}
@keyframes spiral-point{from{opacity:0}to{opacity:.42}}
@keyframes word-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes gaia-drift{from{transform:translate(0,0) scale(1)}to{transform:translate(26px,-14px) scale(1.12)}}
.ph-wrap{padding:20px;display:flex;align-items:center;justify-content:center;}
.ph-body{width:390px;height:844px;background:#0C0A12;border-radius:52px;position:relative;flex-shrink:0;
  box-shadow:0 0 0 1px rgba(255,255,255,.07),0 40px 100px rgba(0,0,0,.92),inset 0 0 0 1px rgba(255,255,255,.04);}
.ph-body::before{content:'';position:absolute;left:-3px;top:160px;width:3px;height:44px;background:#181620;border-radius:2px 0 0 2px;box-shadow:0 60px 0 #181620,0 108px 0 #181620;}
.ph-body::after{content:'';position:absolute;right:-3px;top:194px;width:3px;height:76px;background:#181620;border-radius:0 2px 2px 0;}
.ph-screen{position:absolute;inset:10px;border-radius:43px;overflow:hidden;background:#F4EBD4;}
.ph-island{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:126px;height:36px;background:#000;border-radius:20px;z-index:200;}
.ph-content{position:absolute;inset:0;overflow:hidden;}
</style>
</head>
<body>
<div id="root"></div>
<script src="shell/walk-canon.js"></script>
<script type="text/babel" src="shell/tweaks-panel.jsx"></script>
<script type="text/babel" src="shell/bindu-room.jsx"></script>
<script type="text/babel" src="shell/bindu-moments.jsx"></script>
<script type="text/babel" src="shell/bindu-practice.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const BINDU_DEFAULTS = /*EDITMODE-BEGIN*/{
  "canonMarks": false,
  "arrivalGesture": "still-touch",
  "pace": 1
}/*EDITMODE-END*/;

const ROOM_KEY = 'bindu-room-state';
function loadRoom() {
  try { return JSON.parse(localStorage.getItem(ROOM_KEY)) || { arrived: false, threads: {}, gate_given: false }; }
  catch (e) { return { arrived: false, threads: {}, gate_given: false }; }
}

function BinduApp() {
  const [t, setTweak] = useTweaks(BINDU_DEFAULTS);
  const [state, setState] = useState(loadRoom);
  const [screen, setScreen] = useState(() => (loadRoom().arrived ? 'room' : 'arrival'));
  useEffect(() => { try { localStorage.setItem(ROOM_KEY, JSON.stringify(state)); } catch (e) {} }, [state]);

  const threadDone = (key) => {
    setState(s => ({ ...s, threads: { ...s.threads, [key]: true } }));
    setScreen('room');
  };
  const reset = () => {
    setState({ arrived: false, threads: {}, gate_given: false });
    setScreen('arrival');
  };

  const pace = t.pace, nc = t.canonMarks;
  const screens = {
    arrival: <BinduArrival pace={pace} gesture={t.arrivalGesture} showNC={nc}
      onEnter={() => { setState(s => ({ ...s, arrived: true })); setScreen('room'); }} />,
    room: <BinduRoomScene state={state} showNC={nc} onOpen={k => setScreen(k)} />,
    story: <BinduStory pace={pace} showNC={nc} onDone={() => threadDone('story')} />,
    practice: <BinduPractice pace={pace} showNC={nc} onDone={() => threadDone('practice')} />,
    wakeup: <BinduWakeup pace={pace} showNC={nc} onDone={() => threadDone('wakeup')} />,
    gate: <BinduGate pace={pace} showNC={nc}
      onGiven={() => setState(s => ({ ...s, gate_given: true }))}
      onDone={() => setScreen('room')} />,
  };

  return (
    <div className="ph-wrap">
      <div className="ph-body">
        <div className="ph-screen">
          <div className="ph-island"></div>
          <div className="ph-content">{screens[screen] || screens.room}</div>
        </div>
      </div>
      <TweaksPanel>
        <TweakSection label="The room" />
        <TweakButton label="Arrive again (reset the room)" onClick={reset} />
        <TweakSection label="Arrival" />
        <TweakRadio label="Gesture" value={t.arrivalGesture} options={['still-touch','wait']} onChange={v => setTweak('arrivalGesture', v)} />
        <TweakSection label="Register" />
        <TweakToggle label="Mark non-canon text" value={t.canonMarks} onChange={v => setTweak('canonMarks', v)} />
        <TweakSection label="Pacing" />
        <TweakSlider label="Breath scale" value={t.pace} min={0.3} max={1.6} step={0.05} onChange={v => setTweak('pace', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BinduApp />);
</script>

<div style="padding-bottom:26px;text-align:center;font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(220,210,235,.3);">
  <p>Slice 1a &middot; Room 01 &middot; Bindu &nbsp;&mdash;&nbsp; <a href="The Shell.html">the shell</a> &nbsp;&middot;&nbsp; <a href="Pairing Floor.html">pairing floor</a></p>
</div>
</body>
</html>
