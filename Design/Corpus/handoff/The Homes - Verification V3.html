<div class="wrap">

<script src="all-shaktis-data.js"></script>
<script type="module">
import * as THREE from 'three';
import { register, check, results, makeStage, fingerprint, divergence, measuresOutLoud } from './homes-verify.js?v=1';
import { WORLDS, worldY, WORLD_SPACING } from './homes-worlds.js?v=7';
import { buildChamber, GEM, AUTHORED, isBuilt, cardFor } from './homes-chambers.js?v=28';
import { CARDS, R1, R2, R3, R4, R5, R6, R7, R8, R9, SYLLABLE, CROSSED, RING_START, globalPos, findCard, bodyAltitude, nameKey, ATTRIBUTE, ATTR_TINT } from './homes-cards.js?v=5';
import { buildAttribute } from './homes-attribute.js?v=1';
import { carrierFor } from './homes-sound.js?v=5';
import { todaysPosition, positionForPracticeDay, practiceDayIndex, nextTurnover, locate } from './homes-today.js?v=1';
import { makeMemory } from './homes-memory.js?v=2';

const CARD_RINGS = { 1: R1, 2: R2, 3: R3, 4: R4, 5: R5, 6: R6, 7: R7, 8: R8, 9: R9 };
const BY_RING = window.SHAKTIS_BY_RING || {};
// the cards are the base — the same resolution the Axis uses
const ROSTER = [1,2,3,4,5,6,7,8,9].map((r) => {
  const app = BY_RING[r] || BY_RING[String(r)] || [];
  const cards = CARD_RINGS[r] || [];
  if (!cards.length) return app.map((s, k) => ({ ...s, __ix: k, __ring: r }));
  return cards.map((c, k) => ({
    name: c.name, short: c.name, ring: r, pos: c.pos, quality: c.quality,
    appName: app[k] && app[k].name !== c.name ? app[k].name : null,
    __ix: k, __ring: r,
  }));
});
const ALL = ROSTER.flat();
const EXPECT = [28,16,8,14,10,10,12,3,1];
const stage = makeStage();

// ═══ 1 · CANON — every datum traces to the user's files ════════════════════
register('canon');
check('all 102 cards exist, one per khaḍgamālā position', () => {
  const missing = [];
  for (let p = 1; p <= 102; p++) if (!CARDS[p]) missing.push(p);
  return missing.length ? `missing ${missing.join(',')}` : true;
});
check('every card carries quality, tattva, location, roots and phrase', () => {
  const bad = [];
  for (let p = 1; p <= 102; p++) {
    const c = CARDS[p];
    if (!c) continue;
    if (!c.quality || !c.tattva || !c.loc || !c.roots || !c.roots.length || !c.phrase) bad.push(p + ' ' + c.name);
  }
  return bad.length ? bad.slice(0, 6).join(' · ') : true;
});
check('every card carries her Devanāgarī', () => {
  const bad = [];
  for (let p = 1; p <= 102; p++) {
    const c = CARDS[p];
    if (c && !/[\u0900-\u097F]/.test(c.dev || '')) bad.push(p);
  }
  return bad.length ? 'not Devanāgarī at ' + bad.join(',') : true;
}, 'the writing hand must write her script, not a transliteration');
check('ring spans match KhadgamalaMap.swift', () => {
  const want = { 1: 1, 2: 29, 3: 45, 4: 53, 5: 67, 6: 77, 7: 87, 8: 99, 9: 102 };
  for (const k of Object.keys(want)) if (RING_START[k] !== want[k]) return `ring ${k} starts ${RING_START[k]}, repo says ${want[k]}`;
  return true;
}, 'checked against the shipped app, not from memory');
check('no invented bīja frequency — the carrier derives from her syllable', () => {
  // her interval must follow the varṇamālā's ORDER, and be root-relative
  const a = carrierFor(100, 'Aṃ'), b = carrierFor(100, 'Kaṃ'), c = carrierFor(100, 'Caṃ');
  const scaled = carrierFor(200, 'Kaṃ');
  if (!(a < b && b < c)) return `out of alphabet order: ${a} ${b} ${c}`;
  if (Math.abs(scaled - b * 2) > 0.001) return 'not root-relative';
  if (carrierFor(100, null) !== 100) return 'an unnamed syllable must fall silent to the root';
  return true;
}, 'the pitch is ours, the interval is hers');
check('the roster totals 102 at 28·16·8·14·10·10·12·3·1', () => {
  const got = ROSTER.map((r) => r.length);
  return got.join(',') === EXPECT.join(',') ? true : 'got ' + got.join(',');
});

// ═══ 2 · COVERAGE — all 102, correct card, correct ring ═══════════════════
register('coverage');
check('every one of the 102 resolves to a built room', () => {
  const seats = ALL.filter((s) => !isBuilt(s, s.__ring, s.__ix));
  return seats.length ? seats.length + ' still seats: ' + seats.slice(0, 4).map((s) => s.name).join(', ') : true;
});
check('every Śakti resolves to a card of HER OWN ring', () => {
  const wrong = ALL.filter((s) => { const c = cardFor(s, s.__ring, s.__ix); return !c || c.ring !== s.__ring; });
  return wrong.length ? wrong.slice(0, 5).map((s) => s.__ring + ':' + s.name).join(' · ') : true;
}, 'names collide across rings — Kāmeśvarī is in both 7 and 8');
check('the known collisions resolve by position, not by name', () => {
  const r7 = ROSTER[6].find((s) => nameKey(s.name) === nameKey('Kāmeśvarī'));
  const r8 = ROSTER[7].find((s) => nameKey(s.name) === nameKey('Kāmeśvarī'));
  if (!r7 || !r8) return { pass: true, detail: 'collision not present in this roster' };
  const c7 = cardFor(r7, 7, r7.__ix), c8 = cardFor(r8, 8, r8.__ix);
  return (c7 && c7.ring === 7 && c8 && c8.ring === 8) ? true : 'still crossing rings';
});
check('every chamber exposes update() and a label', () => {
  const bad = [];
  ALL.forEach((s) => {
    try {
      const ch = buildChamber(WORLDS[s.__ring - 1], s);
      if (!ch || typeof ch.update !== 'function' || typeof ch.label !== 'string' || !ch.group) bad.push(s.name);
    } catch (e) { bad.push(s.name + ' threw'); }
  });
  return bad.length ? bad.slice(0, 5).join(', ') : true;
});
check('no Śakti falls through to the shared seat', () => {
  const seat = ALL.filter((s) => {
    const ch = buildChamber(WORLDS[s.__ring - 1], s);
    return ch.label === 'her seat, from inside';
  });
  return seat.length ? seat.length + ' on the shared floor: ' + seat.slice(0, 4).map((s) => s.name).join(', ') : true;
});

// ═══ 3 · DISTINCTION — the brief's own test, measured ════════════════════
register('distinction');
const labels = new Map(), prints = new Map();
ALL.forEach((s) => {
  const ch = buildChamber(WORLDS[s.__ring - 1], s);
  const near = (ch.update(20), ch.label);
  const fp = fingerprint(ch, 30);
  const ch2 = buildChamber(WORLDS[s.__ring - 1], s);
  ch2.update(300);
  labels.set(s, { near, deep: ch2.label });
  prints.set(s, fp);
});
check('no two Śaktis in one ring speak the same near words', () => {
  const clashes = [];
  ROSTER.forEach((list, i) => {
    const seen = new Map();
    list.forEach((s) => {
      const l = labels.get(s).near;
      if (seen.has(l)) clashes.push(`ring ${i + 1}: ${seen.get(l)} = ${s.name}`);
      else seen.set(l, s.name);
    });
  });
  return clashes.length ? clashes.slice(0, 4).join(' · ') : true;
}, 'could this room belong to any other Śakti?');
check('every room reverses its premise at the second adaptation', () => {
  const flat = ALL.filter((s) => labels.get(s).near === labels.get(s).deep);
  return flat.length ? flat.length + ' never turn: ' + flat.slice(0, 4).map((s) => s.name).join(', ') : true;
});
check('adjacent sisters diverge geometrically by more than a tenth', () => {
  const weak = [];
  ROSTER.forEach((list, i) => {
    for (let k = 0; k + 1 < list.length; k++) {
      const d = divergence(prints.get(list[k]), prints.get(list[k + 1]));
      if (d < 0.1) weak.push(`${i + 1}:${list[k].name}~${list[k + 1].name} ${(d * 100).toFixed(0)}%`);
    }
  });
  return weak.length ? weak.slice(0, 5).join(' · ') : true;
}, 'aperture and rate must actually differ, not just the words');
check('her world conditions her room — the same mechanism differs by āvaraṇa', () => {
  const s = ROSTER[2][0];
  const a = fingerprint(buildChamber(WORLDS[2], s), 30);
  const b = fingerprint(buildChamber(WORLDS[5], s), 30);
  const d = divergence(a, b);
  return d > 0.02 ? true : `only ${(d * 100).toFixed(1)}% differs between rings`;
});

// ═══ 4 · LEGIBILITY — every room actually renders ════════════════════════
register('legibility');
const shots = new Map();
ALL.forEach((s) => {
  const w = WORLDS[s.__ring - 1];
  const ch = buildChamber(w, s);
  const near = stage(ch, 20, w.density * 2, w.fog);
  const ch2 = buildChamber(w, s);
  const deep = stage(ch2, 300, w.density * 2, w.fog);
  shots.set(s, { near, deep });
});
check('no room renders black at the first adaptation', () => {
  const dark = ALL.filter((s) => shots.get(s).near.max < 28);
  return dark.length ? dark.length + ' unreadable: ' + dark.slice(0, 5).map((s) => s.name + '(' + shots.get(s).near.max + ')').join(', ') : true;
});
check('no room blows out to white', () => {
  const hot = ALL.filter((s) => shots.get(s).near.min > 232);
  return hot.length ? hot.slice(0, 5).map((s) => s.name).join(', ') : true;
});
check('every room has internal contrast — light falls somewhere', () => {
  const flat = ALL.filter((s) => shots.get(s).near.spread < 10);
  return flat.length ? flat.length + ' flat: ' + flat.slice(0, 5).map((s) => s.name + '(' + shots.get(s).near.spread + ')').join(', ') : true;
});
check('the second adaptation is still legible', () => {
  const dark = ALL.filter((s) => shots.get(s).deep.max < 24);
  return dark.length ? dark.length + ' go dark deep: ' + dark.slice(0, 5).map((s) => s.name).join(', ') : true;
});
check('the light visibly changes between the two adaptations', () => {
  const still = ALL.filter((s) => {
    const a = shots.get(s).near, b = shots.get(s).deep;
    return Math.abs(a.mean - b.mean) < 2 && Math.abs(a.spread - b.spread) < 3;
  });
  return still.length ? still.length + ' unchanged: ' + still.slice(0, 5).map((s) => s.name).join(', ') : true;
});

// ═══ 5 · PROMISE — every written claim, asserted ═════════════════════════
register('promise');
check('time is elapsed, never device-tied', () => {
  const s = ROSTER[0][0];
  const ch = buildChamber(WORLDS[0], s);
  const a = fingerprint(ch, 40).join(''), b = fingerprint(ch, 40).join(''), c = fingerprint(ch, 41).join('');
  if (a !== b) return 'not a pure function of elapsed time';
  if (a === c) return 'the room does not advance with time';
  return true;
}, 'locked decision, governs all 102');
check('the head start comes from dwell, not from visit count', () => {
  const m = makeMemory();
  m.forget();
  const s = { id: 9001, name: 'probe' };
  for (let i = 0; i < 6; i++) m.record(s, 0.2);       // many visits, no dwelling
  const cheap = m.headStart(s);
  m.forget();
  m.record(s, 200);                                     // one long stay
  const earned = m.headStart(s);
  m.forget();
  return earned > cheap * 4 ? true : `gamed: ${cheap.toFixed(1)} vs ${earned.toFixed(1)}`;
}, 'it must not be gameable by entering and leaving');
check('the ceremony compresses on return but is never skipped', () => {
  const m = makeMemory();
  m.forget();
  const s = { id: 9002, name: 'probe2' };
  const first = m.compression(s);
  for (let i = 0; i < 9; i++) m.record(s, 30);
  const later = m.compression(s);
  m.forget();
  if (first !== 1) return 'a first visit must run whole';
  if (!(later < first)) return 'return does not soften';
  if (later < 0.3) return 'compressed to nothing — that is skipping';
  return true;
});
check('the second adaptation is reachable only through relationship', () => {
  const m = makeMemory();
  m.forget();
  const s = { id: 9003, name: 'probe3' };
  const cold = m.headStart(s);
  for (let i = 0; i < 4; i++) m.record(s, 150);
  const warm = m.headStart(s);
  m.forget();
  return (cold === 0 && warm >= 200) ? true : `cold ${cold}, warm ${warm.toFixed(0)} — the hold ends at 227`;
});
check('the fifth is withheld outside the ninth world', () => {
  const m = makeMemory();
  m.forget();
  const s = { id: 9004, name: 'probe4' };
  const early = m.grantsFifth(s, 3, 30);
  const ninth = m.grantsFifth(s, 9, 30);
  m.forget();
  return (early === 0 && ninth === 1) ? true : `ring 3 gave ${early}, ring 9 gave ${ninth}`;
});
check('today matches DailyEnergyService: a true permutation per cycle', () => {
  const day = practiceDayIndex();
  const cycle = Math.floor(day / 102);
  const seen = new Set();
  for (let s = 0; s < 102; s++) seen.add(positionForPracticeDay(cycle * 102 + s, 102));
  if (seen.size !== 102) return `only ${seen.size} unique in the cycle`;
  if (positionForPracticeDay(cycle * 102, 102) === positionForPracticeDay((cycle + 1) * 102, 102)) return 'cycles do not reshuffle';
  return true;
}, 'the design and the app must never name different energies');
check('the practice day turns at 6am local', () => {
  const t = nextTurnover(new Date());
  return t.getHours() === 6 && t.getMinutes() === 0 ? true : 'turns at ' + t.getHours() + ':' + t.getMinutes();
});
check('today resolves to a real Śakti of the right ring', () => {
  const pos = todaysPosition();
  const [wi, ix] = locate(pos, EXPECT);
  const s = ROSTER[wi][ix];
  const c = CARDS[pos];
  if (!s || !c) return 'position ' + pos + ' resolves to nobody';
  return { pass: c.ring === wi + 1, detail: `day ${practiceDayIndex()} · position ${pos} · ${c.name}` };
});
check('the body altitude of every card lies inside the body', () => {
  const bad = [];
  for (let p = 1; p <= 102; p++) {
    const a = bodyAltitude(CARDS[p]);
    if (!(a > 0 && a < 1)) bad.push(p);
  }
  return bad.length ? bad.join(',') : true;
});
check("Ring 2's crossing is real: the presented and answering halves differ", () => {
  const s = ROSTER[1].find((x) => cardFor(x, 2, x.__ix) && CROSSED[cardFor(x, 2, x.__ix).pos]);
  if (!s) return 'no crossed Śakti in the roster';
  const ch = buildChamber(WORLDS[1], s);
  const near = fingerprint(ch, 30);
  const ch2 = buildChamber(WORLDS[1], s);
  const deep = fingerprint(ch2, 320);
  const d = divergence(near, deep);
  return d > 0.3 ? { pass: true, detail: `${(d * 100).toFixed(0)}% converges` } : `only ${(d * 100).toFixed(0)}% moves`;
}, 'THE KEY PAIRING — body and mind at one point');

// ═══ 6 · FELT — nothing measures you out loud ════════════════════════════
register('felt');
check('no room label measures the walker', () => {
  const bad = [];
  ALL.forEach((s) => {
    const l = labels.get(s);
    [l.near, l.deep].forEach((x) => { const m = measuresOutLoud(x); if (m.length) bad.push(s.name + ': ' + x); });
  });
  return bad.length ? bad.slice(0, 4).join(' · ') : true;
}, 'the instrument may know everything and must display none of it');
check('no card phrase or quality measures the walker', () => {
  const bad = [];
  for (let p = 1; p <= 102; p++) {
    const c = CARDS[p];
    if (measuresOutLoud(c.phrase + ' ' + c.quality).length) bad.push(p);
  }
  return bad.length ? bad.join(',') : true;
});
check('every label speaks plainly — no project jargon leaks into the room', () => {
  const jargon = /\b(P\d|avarana\b|tattva\b|mechanism|archetype|grammar|update\(|undefined|NaN|\[object)/i;
  const bad = ALL.filter((s) => jargon.test(labels.get(s).near) || jargon.test(labels.get(s).deep));
  return bad.length ? bad.slice(0, 4).map((s) => s.name + ': ' + labels.get(s).near).join(' · ') : true;
});
check('no label is empty, truncated or a placeholder', () => {
  const bad = ALL.filter((s) => {
    const l = labels.get(s);
    return !l.near || l.near.length < 8 || /^\s|\s$|·\s*$|^\s*·/.test(l.near) || /undefined|null/.test(l.near + l.deep);
  });
  return bad.length ? bad.slice(0, 4).map((s) => s.name + ': "' + labels.get(s).near + '"').join(' · ') : true;
});
check('the nine worlds are a continuous climb — no gaps between bands', () => {
  for (let i = 1; i < WORLDS.length; i++) {
    if (worldY(i) - worldY(i - 1) !== WORLD_SPACING) return 'uneven spacing at ' + i;
  }
  return WORLD_SPACING > 0 ? true : 'no spacing';
}, 'no cuts, only travel');
check("each world's weather is named, and no two alike", () => {
  const w = WORLDS.map((x) => x.weather);
  if (w.some((x) => !x || x.length < 12)) return 'a world has no weather';
  return new Set(w).size === 9 ? true : 'weather repeats';
});
check('every world names its gem, dhātu, clock and body-region', () => {
  const bad = WORLDS.filter((w) => !w.gem || !w.dhatu || !w.clock || !w.region);
  return bad.length ? bad.map((w) => w.n).join(',') : true;
});

// ═══ 7 · COHERENCE — one instrument, no orphans, no lost features ════════
// The register V1 and V2 were structurally blind to: not "is this piece right"
// but "do the pieces still agree, and did anything get dropped on the way".
const SRC = {};
for (const f of ['The Homes - The Axis.html', 'Bindu Mandala - The Rite of Entering.html',
                 'The Homes - Rooms in 3D.html', 'The Homes - The Nine Worlds.html',
                 'The Homes - the thread.md', 'Bindu Mandala - the method.md']) {
  try { const r = await fetch(encodeURI(f)); SRC[f] = r.ok ? await r.text() : ''; } catch (e) { SRC[f] = ''; }
}
const AXIS = SRC['The Homes - The Axis.html'];
let SNDSRC = '';
try { const r = await fetch('homes-sound.js?v=5'); SNDSRC = r.ok ? await r.text() : ''; } catch (e) {}
const RITE = SRC['Bindu Mandala - The Rite of Entering.html'];
const THREAD = SRC['The Homes - the thread.md'];
const METHOD = SRC['Bindu Mandala - the method.md'];

register('coherence');
check('the Axis is the instrument — it holds every layer', () => {
  const want = { climb: /worldY|WORLD_SPACING/, 'the rite': /advanceRite/, sound: /makeVoice/,
    memory: /makeMemory/, today: /todaysPosition/, chambers: /buildChamber/, cards: /homes-cards/ };
  const missing = Object.keys(want).filter((k) => !want[k].test(AXIS));
  return missing.length ? 'the Axis lacks ' + missing.join(', ') : true;
});
check('no module reference is stale', () => {
  const refs = [...AXIS.matchAll(/homes-([a-z0-9-]+)\.js\?v=(\d+)/g)].map((m) => m[1] + '@' + m[2]);
  const byName = {};
  refs.forEach((r) => { const [n, v] = r.split('@'); (byName[n] = byName[n] || []).push(v); });
  const split = Object.keys(byName).filter((n) => new Set(byName[n]).size > 1);
  return split.length ? 'two versions of ' + split.join(', ') : { pass: true, detail: refs.join(' ') };
}, 'module scripts cache — a split version silently runs old code');
check('no debug hook of mine survives in any deliverable', () => {
  // scoped to MY hook names: the served HTML also carries the host's own
  // injected editor globals, and matching those was a false positive in V1 of
  // this very check — the harness needs verifying too.
  const MINE = /window\.__(?:probe|ax|dbg|px|grid|enter|adv|p|w|t|f|err)\b/;
  const bad = Object.keys(SRC).filter((f) => /\.html$/.test(f) && MINE.test(SRC[f]));
  return bad.length ? bad.join(', ') : true;
});
check('the descent survives the fold into the Axis', () => {
  // look only at the page's own script, never at host-injected chrome
  const own = (s) => s.replace(/<style data-omelette-injected[\s\S]*?<\/style>/g, '')
                       .replace(/window\.__om[\s\S]{0,4000}?\n/g, '');
  const inRite = /RiteDescent|rite-descent|go deeper/i.test(own(RITE));
  const inAxis = /RiteDescent|rite-descent|chamberDescent|go deeper/i.test(own(AXIS));
  if (inRite && !inAxis) return 'the Rite has a descent — five chambers of her card as motion. The Axis dropped it.';
  return true;
}, 'a feature present in an earlier piece must not vanish in the fold');
check('reduced motion is honoured, not ignored', () => {
  if (!/prefers-reduced-motion/.test(AXIS)) return 'the Axis never asks';
  if (!/reduced\s*\?/.test(AXIS)) return 'it asks and then does nothing with the answer';
  return true;
}, 'the method requires a longer path, never a disabled one');
check('the after-effect still lingers on the whole instrument', () => /RITE_AFTER_DUR|after\s*=\s*\{|afterAt/.test(AXIS) ? true : 'no after-effect', 'her siddhi outlasts the room');
check('every claim of a named file in the thread resolves', () => {
  const named = [...THREAD.matchAll(/`([A-Za-z0-9 .\-—()]+\.(?:html|js|md))`/g)].map((m) => m[1]);
  const missing = [...new Set(named)].filter((f) => SRC[f] === '' && !(f in SRC));
  return missing.length ? { pass: true, detail: 'unfetched (not proof of absence): ' + missing.slice(0, 3).join(', ') } : true;
});
check('the method file states its rules and the thread records decisions', () => {
  if (!METHOD || METHOD.length < 2000) return 'the method is missing or thin';
  const rules = ['mechanism', 'first attempt', 'no cuts', 'elapsed', 'measure it out loud'];
  const absent = rules.filter((r) => !new RegExp(r, 'i').test(METHOD));
  if (absent.length) return 'the method omits: ' + absent.join(', ');
  return THREAD.length > 3000 ? true : 'the thread is too thin to be a record';
});
check('nothing in the walker-facing copy measures her', () => {
  const strings = [...AXIS.matchAll(/textContent\s*=\s*(?:`([^`]*)`|'([^']*)')/g)]
    .map((m) => m[1] || m[2] || '').filter(Boolean);
  const bad = strings.filter((s) => measuresOutLoud(s).length && !/\$\{/.test(s));
  return bad.length ? bad.slice(0, 3).join(' · ') : { pass: true, detail: strings.length + ' strings read' };
});

register('brief');
check('the Śakti cards are treated as the base where the app has drifted', () => {
  const drift = [];
  [1, 2, 3, 4, 5, 6, 7, 8, 9].forEach((r) => {
    const app = (BY_RING[r] || BY_RING[String(r)] || []).map((s) => nameKey(s.name));
    const cards = (CARD_RINGS[r] || []).map((c) => nameKey(c.name));
    if (!app.length) { drift.push('ring ' + r + ': app empty'); return; }
    const missing = cards.filter((n) => !app.includes(n)).length;
    if (missing) drift.push('ring ' + r + ': ' + missing + ' of ' + cards.length + ' absent from the app');
  });
  // divergence is a finding to REPORT, not a failure to hide
  const total = drift.reduce((n, s) => { const m = s.match(/(\d+) of/); return n + (m ? +m[1] : 16); }, 0);
  return { pass: /appName/.test(AXIS), detail: total + ' of 102 names differ from the app · ' + (drift.join(' · ') || 'none') };
}, 'reported, never silently absorbed');
check('the ring hues are the repo\'s own Atmosphere tokens', () => {
  const want = { 1: 35, 2: 43, 3: 341, 4: 353, 5: 18, 6: 194, 7: 322, 8: 2, 9: 46 };
  const bad = Object.keys(want).filter((k) => GEM[k].hue !== want[k]);
  return bad.length ? 'ring ' + bad.join(',') + ' drifted from the token' : true;
}, 'the brief says keep them — the gem gives light quality, not hue');
check('every world names its presiding Form, Yoginī class, state and verb', () => {
  const bad = WORLDS.filter((w) => !w.form || !w.yogini || !w.state || !w.verb);
  return bad.length ? bad.map((w) => w.n).join(',') : true;
});
check('secrecy deepens inward — the veil rises monotonically', () => {
  for (let i = 1; i < WORLDS.length; i++) if (!(WORLDS[i].veil > WORLDS[i - 1].veil)) return 'flat at ring ' + (i + 1);
  return WORLDS[0].veil === 0 && WORLDS[8].veil === 1 ? true : 'does not span manifest to most-secret';
}, 'Prakaṭa (manifest) → Parāparāraharasya');
check('the mental state slows the world as it deepens', () => {
  return (WORLDS[0].tempo === 1 && WORLDS[8].tempo < 0.4) ? true : 'tempo does not slow';
}, 'Jāgrat runs at speed; Pure being barely moves');
check('the doors are walkable from inside — the homes are one building', () => {
  return /walkTo|neighbourOf/.test(AXIS) ? true : 'no corridor';
}, 'khaḍgamālā order is a circle');
check("ring 2's clusters and ring 1's families share corridors", () => {
  return /R2_CLUSTER/.test(AXIS) && /R1_FAMILY/.test(AXIS) ? true : 'neighbourhoods not wired';
});
check('the library is kept and folded, not deleted', () => /fillLibrary/.test(AXIS) ? true : 'the reference sections are gone');
check('her Well letter rests in the room as a folded object', () => /letterFor|homes\.well/.test(AXIS) ? true : 'no letter');
check('the Well letter is never invented', () => {
  const m = AXIS.match(/function letterFor[\s\S]{0,400}/);
  return m && /localStorage/.test(m[0]) && !/Thank you|lorem|placeholder/i.test(m[0]) ? true : 'a letter may be fabricated';
});
check('each ring keeps its own sound technique', () => {
  return /TECHNIQUE/.test(SNDSRC) && /shepard/.test(SNDSRC) && /triad/.test(SNDSRC) ? true : 'nine copies of one drone';
}, 'ground drone · home breath · breathy voice · stepped notes · triad collapse · Shepard tone');
check('the design tokens are the repo\'s', () => {
  const want = ['#0D0508', '#C9963F', '#F2E8D9', 'Cormorant Garamond'];
  const absent = want.filter((t) => !AXIS.includes(t));
  return absent.length ? 'missing ' + absent.join(', ') : true;
});

const PHYS = await (async () => { try { const r = await fetch('homes-grammar.js?v=8'); return r.ok ? await r.text() : ''; } catch (e) { return ''; } })();
check('the physics vocabulary reads the cards, not a dozen words', () => {
  const rules = (PHYS.match(/^\s{2}\[\/.*\],$/gm) || []).length;
  const kinds = new Set([...PHYS.matchAll(/case '([a-z]+)':/g)].map((m) => m[1])).size;
  if (rules < 40) return 'only ' + rules + ' tattva patterns';
  if (kinds < 40) return 'only ' + kinds + ' distinct motions';
  return { pass: true, detail: rules + ' patterns · ' + kinds + ' distinct motions' };
}, 'an audit found 78 of 102 sharing one default breath');
check('the P10 gate: Laghimā and Garimā are unmistakable', () => {
  const la = ROSTER[0].find((s) => /laghim/i.test(s.name));
  const ga = ROSTER[0].find((s) => /garim/i.test(s.name));
  if (!la || !ga) return 'one of them is not in the roster';
  const a = labels.get(la), b = labels.get(ga);
  if (!a || !b) return 'no label';
  if (a.near === b.near) return 'they speak alike';
  const d = divergence(prints.get(la), prints.get(ga));
  const sa = shots.get(la).near, sb = shots.get(ga).near;
  const lightDiff = Math.abs(sa.mean - sb.mean);
  if (d < 0.5) return `only ${(d * 100).toFixed(0)}% of geometry differs`;
  if (lightDiff < 12) return `their light is within ${lightDiff}`;
  return { pass: true, detail: `${(d * 100).toFixed(0)}% geometry · ${lightDiff} light · "${a.near}" vs "${b.near}"` };
}, 'the brief\'s sample-before-batch gate: one must lift, the other press');

register('iconography');
check('every one of the 102 is given her attribute', () => {
  const missing = [];
  for (let p = 1; p <= 102; p++) if (!ATTRIBUTE[p]) missing.push(p);
  return missing.length ? 'no attribute for ' + missing.join(',') : true;
}, 'her held object is a design instruction, not a note');
check('her attribute actually mounts in her room', () => {
  const bad = ALL.filter((s) => {
    const ch = buildChamber(WORLDS[s.__ring - 1], s);
    let found = false;
    ch.group.traverse((o) => { if (/^attribute-/.test(o.name || '')) found = true; });
    return !found;
  });
  return bad.length ? bad.length + ' rooms hold nothing: ' + bad.slice(0, 4).map((s) => s.name).join(', ') : true;
});
check('the attributes are many shapes, not one repeated', () => {
  const kinds = new Set(Object.values(ATTRIBUTE));
  const forms = new Set();
  ALL.forEach((s) => {
    const c = cardFor(s, s.__ring, s.__ix);
    if (!c) return;
    const a = buildAttribute(c, GEM[s.__ring]);
    if (a) forms.add(a.form);
  });
  if (kinds.size < 25) return 'only ' + kinds.size + ' named attributes';
  if (forms.size < 15) return 'only ' + forms.size + ' distinct built forms';
  return { pass: true, detail: kinds.size + ' named · ' + forms.size + ' distinct forms' };
});
check('her attribute moves — it performs rather than sits', () => {
  const still = [];
  ALL.forEach((s) => {
    const c = cardFor(s, s.__ring, s.__ix);
    if (!c) return;
    const ch = buildChamber(WORLDS[s.__ring - 1], s);
    let root = null;
    ch.group.traverse((o) => { if (/^attribute-/.test(o.name || '')) root = o; });
    if (!root) return;
    // a sceptre's whole character is that it barely moves — so rotation and
    // emissive count as motion. The first version of this check ignored both
    // and called fifteen living attributes inert.
    const snap = () => {
      const v2 = [];
      root.traverse((o) => v2.push([
        o.position.x, o.position.y, o.position.z,
        o.rotation.x, o.rotation.y, o.rotation.z,
        o.scale.x, o.scale.y,
        o.material && o.material.opacity != null ? o.material.opacity : 0,
        o.material && o.material.emissiveIntensity != null ? o.material.emissiveIntensity : 0,
      ].map((n) => (+n).toFixed(4)).join(',')));
      return v2.join('|');
    };
    // sampled across a whole cycle, because some attributes act rarely — a
    // vajra strikes once every nine seconds and is still the whole time
    const seen = new Set();
    [8, 12, 15, 19, 24, 31, 40].forEach((tt) => { ch.update(tt); seen.add(snap()); });
    if (seen.size < 2) still.push(s.name);
  });
  return still.length ? still.length + ' inert: ' + still.slice(0, 4).join(', ') : true;
}, 'a noose draws; a cup fills; a sceptre barely moves but does move');
check('the attribute is tinted by her card\'s colour word where it gives one', () => {
  const tints = Object.keys(ATTR_TINT).length;
  return tints >= 10 ? { pass: true, detail: tints + ' colour words honoured' } : 'only ' + tints;
});
check('past the second adaptation the attribute stops being an object', () => {
  const s = ALL.find((x) => x.__ring === 1);
  const ch = buildChamber(WORLDS[0], s);
  let root = null;
  ch.group.traverse((o) => { if (/^attribute-/.test(o.name || '')) root = o; });
  if (!root) return 'no attribute';
  ch.update(20); const near = root.scale.x;
  ch.update(320); const far = root.scale.x;
  return far > near * 2 ? { pass: true, detail: near.toFixed(2) + ' → ' + far.toFixed(2) } : 'it stays a held thing';
}, 'it grows into the room rather than being put down');

// ─── report ───────────────────────────────────────────────────────────────
const out = document.getElementById('out');
let pass = 0, fail = 0;
const NOTE = {
  canon: 'every datum traces to your files — nothing invented',
  coverage: 'all 102, correct card, correct ring — not samples',
  distinction: "the brief's own test, measured rather than asserted",
  legibility: 'every room rendered for real, at both adaptations',
  promise: 'every written claim asserted against the code',
  felt: 'nothing measures the walker; no cuts; depth stays hidden',
};
results().forEach((reg) => {
  const p = reg.checks.filter((c) => c.pass).length, f = reg.checks.length - p;
  pass += p; fail += f;
  const el = document.createElement('div');
  el.className = 'reg';
  el.innerHTML = `<h2><span>${reg.name}</span><em>${NOTE[reg.name] || ''}</em><span style="opacity:.6">${p}/${reg.checks.length}</span></h2>` +
    reg.checks.map((c) => `<div class="row${c.pass ? '' : ' f'}"><span class="dot ${c.pass ? 'ok' : 'no'}">${c.pass ? '✓' : '✕'}</span>` +
      `<span class="id">${c.id}${c.note ? `<small>${c.note}</small>` : ''}</span>` +
      `<span class="d">${c.detail || ''}</span></div>`).join('');
  out.appendChild(el);
});
document.getElementById('tot').innerHTML =
  `<div><span class="k">registers</span><span class="v">6</span></div>` +
  `<div><span class="k">checks</span><span class="v">${pass + fail}</span></div>` +
  `<div><span class="k">passing</span><span class="v ok" style="color:var(--green)">${pass}</span></div>` +
  `<div><span class="k">failing</span><span class="v" style="color:${fail ? 'var(--red)' : 'var(--cream)'}">${fail}</span></div>` +
  `<div><span class="k">śaktis exercised</span><span class="v">${ALL.length}</span></div>` +
  `<div><span class="k">rooms rendered</span><span class="v">${ALL.length * 2}</span></div>`;
document.getElementById('run').textContent = fail
  ? `${fail} failing — read the red rows`
  : `all ${pass} checks pass · ${ALL.length} śaktis · ${ALL.length * 2} renders`;
window.__V3 = { pass, fail, registers: results() };
</script>
