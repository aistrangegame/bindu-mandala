<style>
:root{--gold:#C9963F;--cream:#F2E8D9;--serif:'Cormorant Garamond',Georgia,serif;--mono:ui-monospace,'SF Mono',Menlo,monospace}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--serif)}
a{color:var(--gold)}a:hover{color:var(--cream)}
#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.fade{transition:opacity 900ms linear}
.top{position:absolute;top:32px;left:0;right:0;text-align:center}

.top .sub{margin-top:5px;font-size:13px;font-style:italic;color:var(--cream);opacity:.68;text-shadow:0 2px 18px #000}
.mid{position:absolute;left:50%;transform:translateX(-50%);bottom:120px;width:min(540px,86vw);text-align:center;

.low{position:absolute;left:0;right:0;bottom:84px;text-align:center;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.26em;text-transform:uppercase;color:var(--cream);opacity:.48;text-shadow:0 2px 14px #000}
.climb{position:absolute;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;pointer-events:auto}
.climb button{appearance:none;background:none;border:none;cursor:pointer;padding:6px 0 6px 20px;display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--cream);opacity:.32;transition:opacity 300ms;min-height:30px}
.climb button:hover{opacity:.8}
.climb button[aria-current="true"]{opacity:1}
.climb .tick{width:14px;height:1px;background:currentColor}
.climb button[aria-current="true"] .tick{width:24px;height:2px}
.climb button.met{opacity:.55}
.climb button.met .tick{background:var(--gold)}
.climb button.met[aria-current="true"]{opacity:1}
.acts{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:10px;pointer-events:auto;flex-wrap:wrap;padding:0 18px}
.acts button{appearance:none;cursor:pointer;background:rgba(10,7,10,.5);border:1px solid rgba(242,232,217,.18);color:var(--cream);
  font-family:var(--serif);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;padding:12px 18px;border-radius:2px;
  backdrop-filter:blur(8px);min-height:44px;transition:border-color 300ms,background 300ms}
.acts button:hover{border-color:rgba(201,150,63,.7)}
.acts button[aria-pressed="true"]{border-color:rgba(201,150,63,.9);background:rgba(201,150,63,.16)}
.hint{position:absolute;left:24px;bottom:32px;font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--cream);opacity:.3;text-shadow:0 2px 14px #000;max-width:190px;line-height:1.9}
.after{position:absolute;left:24px;top:34px;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold);opacity:0;text-shadow:0 2px 14px #000;transition:opacity 1200ms linear}

.rite.on{opacity:1}

.rite .phrase{font-size:23px;line-height:1.5;letter-spacing:.04em;color:var(--cream);text-wrap:pretty;text-shadow:0 2px 30px rgba(0,0,0,.95),0 0 70px rgba(0,0,0,.85)}
.rite .written{font-size:38px;letter-spacing:.02em;color:var(--cream);text-shadow:0 0 44px rgba(0,0,0,.9)}

.rite .roots span{font-size:25px;color:var(--cream);text-shadow:0 2px 24px #000}
.rite .gloss{margin-top:15px;font-size:16.5px;font-style:italic;color:var(--cream);opacity:0;letter-spacing:.03em;transition:opacity 1200ms linear;text-shadow:0 2px 20px #000}
.rite .go{margin-top:34px;font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--cream);opacity:0;transition:opacity 1100ms linear}
.rite .beats{position:absolute;bottom:88px;left:0;right:0;display:flex;justify-content:center;gap:9px}
.rite .beats i{width:4px;height:4px;border-radius:2px;background:rgba(242,232,217,.25);transition:width 500ms ease,background 500ms ease}
.rite .beats i.at{width:16px;background:var(--gold)}
.rite .beats i.done{background:rgba(201,150,63,.6)}
.lib{position:absolute;inset:0;z-index:14;display:flex;flex-direction:column;pointer-events:auto;
  opacity:0;transform:translateY(30px);transition:opacity 520ms linear, transform 620ms cubic-bezier(.16,1,.3,1);visibility:hidden}
.lib.on{opacity:1;transform:translateY(0);visibility:visible}
.lib .pad{flex:0 0 88px}
.lib .sheet{flex:1;overflow:auto;border-radius:24px 24px 0 0;padding:24px 26px 70px;
  background:linear-gradient(180deg,rgba(14,10,14,.97),rgba(9,5,8,.99));border-top:1px solid rgba(201,150,63,.2)}
.lib .k{font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);opacity:.55;margin-bottom:20px}
.lib dl{margin:0;display:flex;flex-direction:column;gap:19px}
.lib dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.34;margin-bottom:5px}
.lib dd{margin:0;font-size:16.5px;line-height:1.5;opacity:.82;text-wrap:pretty}
.letter{position:absolute;right:22px;bottom:150px;width:52px;height:46px;border:none;background:transparent;
  cursor:pointer;padding:0;pointer-events:auto;opacity:0;transition:opacity 900ms linear}
.letter.on{opacity:.85}
.letter i{display:block;width:36px;margin-left:auto;border-radius:2px;background:rgba(242,232,217,.14);
  border-top:1px solid rgba(242,232,217,.34);height:14px;transition:height 820ms cubic-bezier(.16,1,.3,1)}
.letter.open i{height:27px}
.note{position:absolute;left:26px;right:26px;bottom:200px;font-style:italic;font-size:16px;line-height:1.55;
  color:var(--cream);opacity:0;text-wrap:pretty;text-shadow:0 2px 22px #000;transition:opacity 900ms linear;pointer-events:none}
.note.on{opacity:.66}
.door{position:absolute;top:34%;height:150px;width:52px;border:none;background:transparent;cursor:pointer;padding:0;pointer-events:auto;
  opacity:0;transition:opacity 800ms linear}
.door.on{opacity:1}
.door.l{left:0}.door.r{right:0}
.door i{position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(242,232,217,.5),transparent)}
.door.l i{left:5px}.door.r i{right:5px}
.door b{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:8px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--cream);opacity:.5;white-space:nowrap;writing-mode:vertical-rl;font-weight:400}
.door.l b{left:14px}.door.r b{right:14px;transform:translateY(-50%) rotate(180deg)}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:20;
  font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--cream);opacity:.5;transition:opacity 900ms}
</style>

<body>
<div id="stage"></div>
<div class="ui">
  <div class="top fade" id="top"><div class="ord" id="ord"></div><div class="nm" id="nm"></div><div class="sub" id="sub"></div></div>
  <div class="mid fade" id="mid"></div>
  <div class="low fade" id="low"></div>
  <div class="presides" id="presides"></div>
  <div class="after" id="after"></div>
  <div class="climb" id="climb"></div>
  <div class="acts" id="acts">
    <button type="button" id="enterBtn">enter her</button>
    <button type="button" id="riseBtn" aria-pressed="false">rise</button>
    <button type="button" id="sndBtn" aria-pressed="false">sound</button>
    <button type="button" id="deeperBtn">go deeper</button>
    <button type="button" id="libBtn">the library</button>
    <button type="button" id="todayBtn">today</button>
    <button type="button" id="deepBtn" aria-pressed="false">stay</button>

  </div>
  <div class="hint" id="hint">scroll to climb · drag to turn · tap a light to enter her</div>
  <button type="button" class="door l" id="doorL" aria-label="her neighbour"><i></i><b></b></button>
  <button type="button" class="door r" id="doorR" aria-label="her neighbour"><i></i><b></b></button>
  <button type="button" class="letter" id="letterBtn" aria-label="her letter"><i></i></button>
  <div class="note" id="note"></div>
  <div class="lib" id="lib"><div class="pad" id="libPad"></div><div class="sheet"><div class="k">the library</div><dl id="libList"></dl></div></div>
  <div class="rite" id="rite">
    <div class="card">
      <div class="phrase" id="ritePhrase"></div>
      <div class="written" id="riteName"></div>
      <div class="roots" id="riteRoots"></div>
      <div class="gloss" id="riteGloss"></div>
      <div class="go" id="riteGo">touch to go on</div>
    </div>
    <div class="beats"><i id="b1"></i><i id="b2"></i><i id="b3"></i></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { WORLDS, WORLD_SPACING, worldY } from './homes-worlds.js?v=7';
import { buildChamber, GEM, AUTHORED, isBuilt, cardFor } from './homes-chambers.js?v=28';
import { SYLLABLE as CARD_SYLL, BIJA as CARD_BIJA2, R1 as CR1, R2 as CR2, R3 as CR3, R4 as CR4, R5 as CR5, R6 as CR6, R7 as CR7, R8 as CR8, R9 as CR9 } from './homes-cards.js?v=5';
const CARD_RINGS = { 1: CR1, 2: CR2, 3: CR3, 4: CR4, 5: CR5, 6: CR6, 7: CR7, 8: CR8, 9: CR9 };
import { glow, sprite, smooth, clamp01 } from './homes-3d-core.js';
import { makeVoice } from './homes-sound.js?v=5';
import { makeMemory } from './homes-memory.js?v=2';
import { buildDescent, STATION_Z } from './homes-descent.js?v=1';
import { R2_CLUSTER, R1_FAMILY } from './homes-cards.js?v=5';
import { todaysPosition, nextTurnover, locate } from './homes-today.js?v=1';
let deepen = 1;
const memory = makeMemory();

const AVA = window.AVARANAS || [];
const voice = makeVoice();

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
// The roster of the 102. The app's data is preferred; where it is missing — Ring 2
// is empty in this project's copy — the Śakti cards stand in, because they ARE the
// base's data. Counts must come out 28 · 16 · 8 · 14 · 10 · 10 · 12 · 3 · 1.
const BY_RING = window.SHAKTIS_BY_RING || {};
// The Śakti cards are the Airtable base. The app's shipped list has drifted from
// it in places — Ring 1 carries no Garimā and its Mudrā slots hold Ring 4 Devī
// names, and Ring 2 is empty entirely. So identity comes from the base, and the
// app's own name is kept alongside wherever the two disagree.
const RINGS = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((r) => {
  const app = BY_RING[r] || BY_RING[String(r)] || [];
  const cards = CARD_RINGS[r] || [];
  if (!cards.length) return app.length ? app : [{ name: WORLDS[r - 1].name, short: WORLDS[r - 1].name, ring: r, pos: 1 }];
  return cards.map((c, k) => {
    const a2 = app[k];
    return {
      name: c.name, short: c.name, ring: r, pos: c.pos, quality: c.quality,
      appName: a2 && a2.name !== c.name ? a2.name : null,
    };
  });
});

const host = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.04;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const fog = new THREE.FogExp2(0x000000, 0.014);
scene.fog = fog;
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 500);

(function () {
  const c = document.createElement('canvas'); c.width = 64; c.height = 32;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 32);
  g.addColorStop(0, '#3a3a44'); g.addColorStop(0.5, '#1a1a20'); g.addColorStop(1, '#0a0a0c');
  x.fillStyle = g; x.fillRect(0, 0, 64, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.environment = tex;
})();

// the nine worlds — the weather you climb through
const bands = WORLDS.map((w, i) => { const b = w.build(worldY(i)); scene.add(b.group); return b; });
const TOP = worldY(WORLDS.length - 1);
const fogCols = WORLDS.map((w) => new THREE.Color(w.fog));

// ── the 102, as presences on the axis ──────────────────────────────────────
// Each āvaraṇa's Śaktis stand in her ring, at her world's altitude. This is the
// real structure: 28 · 16 · 8 · 14 · 10 · 10 · 12 · 3 · 1.
// Who presides today. Same arithmetic as the shipped DailyEnergyService, so
// the instrument and the app always name the same energy on the same date.
let todayPos = todaysPosition();
let turnover = nextTurnover();
const ringLens = RINGS.map((r) => r.length);
let [todayWi, todayIx] = locate(todayPos, ringLens);

const presences = [];
const pickGeo = new THREE.SphereGeometry(0.9, 8, 6);
const pickMat = new THREE.MeshBasicMaterial({ visible: false });
WORLDS.forEach((w, wi) => {
  const list = RINGS[wi], y = worldY(wi), gem = GEM[w.n].c;
  const R = 5.6 + Math.min(list.length, 28) * 0.1;
  list.forEach((sh, k) => {
    const a = (k / list.length) * Math.PI * 2 - Math.PI / 2;
    sh.__ix = k;
    const authored = isBuilt(sh, w.n, k);
    const met = memory.known(sh);
    const presiding = wi === todayWi && k === todayIx;
    const p = new THREE.Group();
    p.position.set(Math.cos(a) * R, y + 0.6 + Math.sin(k * 1.7) * 0.5, Math.sin(a) * R - 1.4);
    const halo = sprite(glow('pr', 'rgba(255,255,255,1)', 'rgba(255,255,255,0)'), gem, authored ? 1.5 : 0.95, authored ? 0.9 : 0.5);
    p.add(halo);
    const pick = new THREE.Mesh(pickGeo, pickMat);
    p.add(pick);
    scene.add(p);
    // she was expecting you: a Śakti already met carries her own core light
    let core = null;
    if (met) {
      core = sprite(glow('pk', 'rgba(255,255,255,1)', 'rgba(255,255,255,0)'), 0xffffff, 0.5, 0.9);
      p.add(core);
    }
    // she who presides carries her own standing light — you did not choose her
    let crown = null;
    if (presiding) {
      crown = sprite(glow('td', 'rgba(255,255,255,1)', 'rgba(255,255,255,0)'), 0xffffff, 3.4, 0.9);
      p.add(crown);
    }
    presences.push({ group: p, halo, core, crown, pick, shakti: sh, world: w, wi, authored, met, presiding, base: authored ? 1.5 : 0.95 });
  });
});
const pickables = presences.map((p) => p.pick);

// ── travel ─────────────────────────────────────────────────────────────────
let climb = 0, target = 0, t = 0, last = performance.now();
let yaw = 0, pitch = 0, tYaw = 0, tPitch = 0, rising = false;
let mode = 'axis', trav = 0, travTo = 0, chamber = null, chamberHolder = null, chamberT = 0, active = null;
// The rite IS the distance. Three beats, three surges of travel, self-paced.
const STATION = [0, 0.3, 0.62, 0.88, 1];
let beat = 0, beatAt = 0, headStart = 0, enteredAt = 0;
// Going deeper is not a sheet — it is the same inward travel continued.
let descent = null, station = -1, dz = 0, dzTo = 0;
// The khaḍgamālā is a circle: every home connects to her two neighbours, so the
// homes are one building — walkable from inside, without returning to the axis.
let libOpen = false, letterOpen = false;
let after = null, afterAt = 0;
const axisPos = new THREE.Vector3(), destPos = new THREE.Vector3();

// Her syllable, where the cards name one. Never guessed.
function syllableOf(p) {
  const c = cardFor(p.shakti, p.world.n, p.shakti.__ix);
  return c ? (CARD_SYLL[c.pos] || CARD_BIJA2[c.pos] || null) : null;
}

function nearest() {
  let best = null, bestD = Infinity;
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
  const v = new THREE.Vector3();
  presences.forEach((p) => {
    v.copy(p.group.position).sub(camera.position);
    const dist = v.length();
    if (dist > 26) return;
    const align = v.normalize().dot(fwd);
    if (align < 0.55) return;
    const d = dist * (2 - align);
    if (d < bestD) { bestD = d; best = p; }
  });
  return best;
}

function beginEnter(p) {
  if (!p || mode !== 'axis') return;
  active = p;
  chamberHolder = new THREE.Group();
  chamberHolder.position.copy(p.group.position);
  chamber = buildChamber(p.world, p.shakti);
  chamberHolder.add(chamber.group);
  // the traces of every time you have stood here
  const mem = memory.of(p.shakti);
  if (mem.v > 0) {
    const traces = new THREE.Group();
    for (let i = 0; i < Math.min(mem.v, 7); i++) {
      const s = sprite(glow('tr', 'rgba(255,255,255,1)', 'rgba(255,255,255,0)'), GEM[p.world.n].c, 1.1, 0.16);
      s.position.set(Math.sin(i * 2.3) * 1.2, -4.1, -1.4 + Math.cos(i * 1.9) * 1.1);
      traces.add(s);
    }
    traces.name = 'traces';
    chamberHolder.add(traces);
  }
  headStart = memory.headStart(p.shakti);
  chamberHolder.scale.setScalar(0.02);
  scene.add(chamberHolder);
  chamberT = 0; trav = 0; travTo = STATION[1]; mode = 'rite'; beat = 1; beatAt = t;
  rising = false; syncRise();
  axisPos.copy(camera.position);
  destPos.copy(p.group.position);
  writeShakti(p);
  writeRite(p, 1);
  voice.strike(p.world.n, 1, syllableOf(p));
  document.getElementById('rite').classList.add('on');
}

function advanceRite() {
  if (mode !== 'rite') return;
  if (beat >= 3) {
    travTo = 1; mode = 'entering';
    document.getElementById('rite').classList.remove('on');
    return;
  }
  beat += 1; beatAt = t; travTo = STATION[beat];
  writeRite(active, beat);
  voice.strike(active.world.n, beat, syllableOf(active));
}

// Her name, opened into its real compound parts. Only splits on morphemes that
// actually occur in the khaḍgamālā — never guessed from capitalisation.
const PREFIX = ['Sarva', 'Anaṅga', 'Mahā', 'Tripura', 'Kāmeśvarī', 'Vajreśvarī', 'Bhaga'];
const SUFFIX = ['ākarṣiṇī', 'karṣiṇī', 'mayī', 'pradā', 'kāriṇī', 'sundarī', 'mālinī', 'eśvarī', 'iṇī', 'inī'];
function riteRoots(name) {
  let s = String(name), head = null, tail = null;
  for (const p of PREFIX) if (s.startsWith(p) && s.length > p.length + 1) { head = p; s = s.slice(p.length); break; }
  for (const q of SUFFIX) if (s.endsWith(q) && s.length > q.length + 1) { tail = q; s = s.slice(0, -q.length); break; }
  const parts = [head, s, tail].filter(Boolean);
  return parts.length > 1 ? parts : [name];
}

// Her rite, from whatever the data actually holds — never invented.
function writeRite(p, n) {
  const ava = AVA[p.wi] || {};
  const ph = document.getElementById('ritePhrase');
  const nm = document.getElementById('riteName');
  const rt = document.getElementById('riteRoots');
  const gl2 = document.getElementById('riteGloss');
  ph.style.display = n === 1 ? 'block' : 'none';
  nm.style.display = n === 2 ? 'block' : 'none';
  rt.style.display = n === 3 ? 'flex' : 'none';
  gl2.style.display = n === 3 ? 'block' : 'none';
  gl2.style.opacity = '0';
  document.getElementById('riteGo').style.opacity = '0';
  const card = cardFor(p.shakti, p.world.n, p.shakti.__ix);
  if (n === 1) {
    ph.textContent = (card && card.phrase) || ava.appreciationPhrase || 'Thank you for what was always already here.';
    ph.style.opacity = '0';
  }
  if (n === 2) { nm.textContent = (card && card.dev) || p.shakti.name; }
  if (n === 3) {
    const roots = (card && card.roots && card.roots.length > 1) ? card.roots : riteRoots(p.shakti.name);
    rt.innerHTML = roots.map((s) => '<span>' + s + '</span>').join('');
    gl2.textContent = (card && card.quality) || p.shakti.quality || ava.subtitle || '';
  }
  [1, 2, 3].forEach((k) => {
    const el = document.getElementById('b' + k);
    el.className = k === n ? 'at' : k < n ? 'done' : '';
  });
}

// Her cluster-sisters (ring 2) or her family (ring 1) share a corridor, so a
// door opens sideways within her neighbourhood before it opens around the circle.
function neighbourOf(p, dir) {
  const list = RINGS[p.wi];
  const n = list.length;
  if (n < 2) return null;
  const card = cardFor(p.shakti, p.world.n, p.shakti.__ix);
  if (card) {
    const group = card.ring === 2 ? R2_CLUSTER : card.ring === 1 ? R1_FAMILY : null;
    if (group) {
      const mine = group(card.pos);
      for (let step = 1; step <= n; step++) {
        const k = (p.shakti.__ix + dir * step + n * 2) % n;
        const c2 = cardFor(list[k], p.world.n, k);
        if (c2 && group(c2.pos) === mine) return presences.find((x) => x.wi === p.wi && x.shakti.__ix === k);
      }
    }
  }
  const k = (p.shakti.__ix + dir + n) % n;
  return presences.find((x) => x.wi === p.wi && x.shakti.__ix === k);
}

// The reference sections, kept and folded — for when you want the text.
function fillLibrary(p) {
  const c = cardFor(p.shakti, p.world.n, p.shakti.__ix);
  const w = p.world;
  const rows = [];
  if (c) {
    rows.push(['quality', c.quality], ['esoteric tattva', c.tattva], ['bodily location', c.loc],
      ['etymology', (c.roots || []).join(' + ')], ['inscription', c.phrase], ['devanāgarī', c.dev]);
    const syl = syllableOf(p);
    if (syl) rows.push(['bīja', syl]);
  }
  rows.push(['āvaraṇa', w.n + ' — ' + w.name], ['presiding form', w.form], ['world', w.gem + ' on ' + w.dhatu],
    ['clock', w.clock], ['altitude', w.region], ['yoginī class', w.yogini], ['mental state', w.state], ['verb', w.verb]);
  $('libList').innerHTML = rows.filter((r) => r[1]).map((r) => '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>').join('');
}

// Her Well letter, if one was ever written. Never invented.
const WELL_KEY = 'homes.well.v1';
function letterFor(p) {
  const c = cardFor(p.shakti, p.world.n, p.shakti.__ix);
  if (!c) return null;
  try { return (JSON.parse(localStorage.getItem(WELL_KEY) || '{}'))[String(c.pos)] || null; } catch (e) { return null; }
}

// Walking the corridor. Not a return to the axis and not a cut: her room is
// released, and the crossing to her neighbour begins from exactly where you
// stand — so the rite runs again, and the travel is continuous.
function walkTo(nb) {
  if (!nb) return;
  libOpen = false; letterOpen = false;
  $('lib').classList.remove('on');
  $('letterBtn').classList.remove('open');
  $('note').classList.remove('on');
  if (chamberHolder) { scene.remove(chamberHolder); chamberHolder = null; chamber = null; }
  descent = null; station = -1; dz = 0; dzTo = 0;
  const from = camera.position.clone();
  mode = 'axis'; active = null; trav = 0;
  climb = target = worldY(nb.wi);
  beginEnter(nb);
  // the crossing starts where you were standing, not out on the axis
  axisPos.copy(from);
}

function beginLeave() {
  if (mode !== 'room') return;
  memory.record(active.shakti, t - enteredAt);
  active.met = true;
  if (!active.core) {
    active.core = sprite(glow('pk', 'rgba(255,255,255,1)', 'rgba(255,255,255,0)'), 0xffffff, 0.5, 0.9);
    active.group.add(active.core);
  }
  const rb = [...rail.children][WORLDS.length - 1 - active.wi];
  if (rb) rb.classList.add('met');
  mode = 'leaving';
  after = active.world.n; afterAt = t;
  const el = document.getElementById('after');
  el.textContent = `her siddhi is still on the instrument`;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 12000);
}

function endLeave() {
  document.getElementById('rite').classList.remove('on');
  beat = 0; travTo = 0;
  descent = null; station = -1; dz = 0; dzTo = 0;
  libOpen = false; letterOpen = false;
  $('lib').classList.remove('on'); $('letterBtn').classList.remove('open'); $('note').classList.remove('on');
  if (chamberHolder) { scene.remove(chamberHolder); chamberHolder = null; chamber = null; }
  mode = 'axis'; active = null; trav = 0;
  writeWorld(Math.round(climb / WORLD_SPACING));
}

// ── words ──────────────────────────────────────────────────────────────────
const ordName = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth', 'ninth'];
const $ = (id) => document.getElementById(id);
let shownWorld = -1;
function writeWorld(ix) {
  if (mode !== 'axis' || ix === shownWorld) return;
  shownWorld = ix;
  const w = WORLDS[ix];
  $('ord').textContent = `${w.form} · the ${ordName[ix]} āvaraṇa · ${w.region}`;
  $('nm').textContent = w.name;
  $('sub').textContent = `${w.gem} on ${w.dhatu} · ${w.clock}`;
  $('low').textContent = '';
  $('mid').textContent = w.weather;
  const pr = presences.find((p) => p.presiding);
  $('presides').textContent = pr ? (ix === pr.wi ? 'she presides today' : '') : '';
  [...rail.children].forEach((b, k) => b.setAttribute('aria-current', String(k === ix)));
}
function writeShakti(p) {
  shownWorld = -1;
  $('ord').textContent = `${p.world.region} · the ${ordName[p.wi]} āvaraṇa`;
  $('nm').textContent = p.shakti.name;
  const c = cardFor(p.shakti, p.world.n, p.shakti.__ix);
  $('sub').textContent = (c && c.quality) || p.shakti.quality || `${p.world.gem} on ${p.world.dhatu}`;
  $('mid').textContent = '';
}

const rail = $('climb');
WORLDS.forEach((w, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = `<span>${w.region}</span><span class="tick"></span>`;
  if (memory.ringKnown(RINGS[i])) b.classList.add('met');
  b.addEventListener('click', () => { if (mode === 'axis') { target = worldY(i); rising = false; syncRise(); } });
  rail.insertBefore(b, rail.firstChild);
});

const riseBtn = $('riseBtn'), enterBtn = $('enterBtn');
const syncRise = () => riseBtn.setAttribute('aria-pressed', String(rising));
riseBtn.addEventListener('click', () => {
  if (mode !== 'axis') return;
  rising = !rising;
  if (rising && climb >= TOP - 0.5) { climb = 0; target = 0; }
  syncRise();
});
enterBtn.addEventListener('click', () => {
  if (mode === 'rite') advanceRite();
  else if (mode === 'room') beginLeave();
  else if (mode === 'axis') beginEnter(nearest());
});
const sndBtn = document.getElementById('sndBtn');
sndBtn.addEventListener('click', () => {
  const want = sndBtn.getAttribute('aria-pressed') !== 'true';
  sndBtn.setAttribute('aria-pressed', String(want));
  if (want) { voice.start(); voice.wake(); } else { voice.stop(); }
});
addEventListener('keydown', (e) => { if (e.key === 'Escape') beginLeave(); });
// "stay" runs her clock faster so the second adaptation can be reviewed. It
// changes nothing about the room — only how long you must be here to see it.
const deepBtn = document.getElementById('deepBtn');
deepBtn.addEventListener('click', () => {
  deepen = deepen === 1 ? 14 : 1;
  deepBtn.setAttribute('aria-pressed', String(deepen !== 1));
  deepBtn.textContent = deepen === 1 ? 'stay' : 'staying';
});
const doorL = $('doorL'), doorR = $('doorR'), letterBtn = $('letterBtn'), lib = $('lib'), note = $('note');
[[doorL, -1], [doorR, 1]].forEach(([btn, dir]) => {
  btn.addEventListener('click', () => {
    if (mode !== 'room' || !active) return;
    const nb = neighbourOf(active, dir);
    if (!nb) return;
    walkTo(nb);
  });
});
letterBtn.addEventListener('click', () => {
  letterOpen = !letterOpen;
  letterBtn.classList.toggle('open', letterOpen);
  note.classList.toggle('on', letterOpen);
});
$('libPad').addEventListener('click', () => { libOpen = false; lib.classList.remove('on'); });
const deeperBtn = document.getElementById('deeperBtn');
deeperBtn.addEventListener('click', () => {
  if (mode !== 'room') return;
  if (!descent) {
    const card = cardFor(active.shakti, active.world.n, active.shakti.__ix);
    if (!card) return;
    descent = buildDescent(card, GEM[active.world.n]);
    chamberHolder.add(descent.group);
    station = 0; dz = 0; dzTo = STATION_Z[0];
  } else if (station < descent.stations - 1) {
    station += 1; dzTo = STATION_Z[station];
  } else { station = -1; dzTo = 0; }
});
$('libBtn').addEventListener('click', () => {
  if (mode !== 'room' || !active) return;
  libOpen = !libOpen;
  if (libOpen) fillLibrary(active);
  lib.classList.toggle('on', libOpen);
});
document.getElementById('todayBtn').addEventListener('click', () => {
  const pr = presences.find((p) => p.presiding);
  if (!pr) return;
  if (mode === 'room' || mode === 'rite' || mode === 'entering') { endLeave(); }
  climb = target = worldY(pr.wi);
  rising = false; syncRise(); shownWorld = -1;
});
document.getElementById('forgetBtn').addEventListener('click', () => {
  memory.forget();
  presences.forEach((p) => {
    p.met = false;
    if (p.core) { p.group.remove(p.core); p.core = null; }
  });
  [...rail.children].forEach((b) => b.classList.remove('met'));
  headStart = 0;
});

// ── looking, climbing, choosing ────────────────────────────────────────────
let dragging = false, moved = 0, px = 0, py = 0;
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; moved = 0; px = e.clientX; py = e.clientY; });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  moved += Math.abs(e.clientX - px) + Math.abs(e.clientY - py);
  tYaw -= (e.clientX - px) * 0.0024; tPitch -= (e.clientY - py) * 0.0016;
  tPitch = Math.max(-0.5, Math.min(0.5, tPitch));
  px = e.clientX; py = e.clientY;
});
addEventListener('pointerup', (e) => {
  dragging = false;
  if (moved > 8) return;
  if (mode === 'rite') { advanceRite(); return; }
  if (mode !== 'axis') return;
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if (hit) beginEnter(presences.find((p) => p.pick === hit.object));
});
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (mode !== 'axis') return;
  rising = false; syncRise();
  target = Math.max(0, Math.min(TOP, target - e.deltaY * 0.055));
}, { passive: false });

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const HOLD = new THREE.Vector3();
function frame(now) {
  try {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    t += dt;

    if (mode === 'rite') {
      trav += (travTo - trav) * (reduced ? 0.018 : 0.03);
      const dur = (reduced ? 3.4 : 2.4) * (active ? memory.compression(active.shakti) : 1);
      const bp = clamp01((t - beatAt) / dur);
      const ph = document.getElementById('ritePhrase');
      const nm = document.getElementById('riteName');
      if (beat === 1) ph.style.opacity = String(clamp01(bp / 0.34) * 0.94);
      if (beat === 2) {
        // an unseen hand writes her name, stroke by stroke
        const seg = Math.min(2.999, bp * 3), i = Math.floor(seg), w = seg - i;
        const eased = w < 0.72 ? w / 0.72 : 1;
        const pct = ((i + eased) / 3) * 100;
        const m = 'linear-gradient(90deg, #000 ' + pct + '%, rgba(0,0,0,0) ' + Math.min(100, pct + 7) + '%)';
        nm.style.webkitMaskImage = m; nm.style.maskImage = m;
      }
      if (beat === 3) {
        const rt = document.getElementById('riteRoots');
        const split = clamp01(bp / 0.58), join = clamp01((bp - 0.52) / 0.48);
        rt.style.gap = ((1 - join) * split * 30).toFixed(1) + 'px';
        document.getElementById('riteGloss').style.opacity = String(clamp01((bp - 0.6) / 0.4) * 0.6);
      }
      document.getElementById('riteGo').style.opacity = bp >= 0.99 ? '0.44' : '0';
      document.getElementById('riteGo').textContent = beat === 3 ? 'touch to enter' : 'touch to go on';
    }
    else if (mode === 'entering') { trav = Math.min(1, trav + dt / (reduced ? 3.4 : 2.2)); if (trav >= 1) { mode = 'room'; chamberT = headStart; enteredAt = t; } }
    else if (mode === 'leaving') { trav = Math.max(0, trav - dt / 2.4); if (trav <= 0) endLeave(); }
    else if (mode === 'axis' && rising) {
      target = Math.min(TOP, target + dt * 3.4);
      if (target >= TOP - 0.05) { rising = false; syncRise(); }
    }
    if (mode === 'axis' || mode === 'leaving') climb += (target - climb) * (reduced ? 0.035 : 0.06);
    if (mode === 'room') chamberT += dt * deepen;

    // the weather is continuous — and it follows you into her room
    const f = climb / WORLD_SPACING;
    const i0 = Math.max(0, Math.min(WORLDS.length - 1, Math.floor(f)));
    const i1 = Math.min(WORLDS.length - 1, i0 + 1);
    const k = clamp01(f - i0);
    fog.color.lerpColors(fogCols[i0], fogCols[i1], k);
    // the Yoginī class is how VEILED the world is — secrecy deepens inward,
    // Prakaṭa (manifest) to Parāparāraharasya. The air thickens as you climb.
    const veil = (WORLDS[i0].veil || 0) * (1 - k) + (WORLDS[i1].veil || 0) * k;
    const baseDens = (WORLDS[i0].density + (WORLDS[i1].density - WORLDS[i0].density) * k) * (1 + veil * 0.55);
    // entering thickens the air until the world is swallowed and only she is left
    const swallow = smooth(trav);
    fog.density = baseDens * (1 + swallow * 1.6);
    scene.background.copy(fog.color).multiplyScalar(0.5 * (1 - swallow * 0.8));

    bands.forEach((b, ix) => {
      const near = Math.abs(worldY(ix) - climb) < WORLD_SPACING * 1.15 && swallow < 0.96;
      b.group.visible = near;
      // the mental state sets the world's tempo: waking runs at speed, pure
      // being barely moves. Her own adaptation clock is untouched by this.
      if (near) b.update(t * (WORLDS[ix].tempo || 1));
    });
    presences.forEach((p) => {
      const near = Math.abs(p.group.position.y - climb) < WORLD_SPACING * 1.2 && swallow < 0.7;
      p.group.visible = near;
      if (!near) return;
      const rate = p.met ? 0.22 : p.authored ? 0.9 : 0.4;
      const depth = p.met ? 0.09 : 0.2;
      const pulse = (1 - depth) + depth * Math.sin(t * rate + (p.shakti.pos || 0));
      p.halo.scale.setScalar(p.base * (p.met ? 1.25 : 1) * pulse * (1 - swallow));
      p.halo.material.opacity = (p.met ? 0.95 : p.authored ? 0.9 : 0.5) * (1 - swallow);
      if (p.core) {
        p.core.scale.setScalar(0.5 * pulse * (1 - swallow));
        p.core.material.opacity = 0.9 * (1 - swallow);
      }
      if (p.crown) {
        const br = 0.86 + 0.14 * Math.sin(t * 0.3);
        p.crown.scale.setScalar(3.4 * br * (1 - swallow));
        p.crown.material.opacity = 0.85 * (1 - swallow);
      }
    });

    if (chamber) {
      chamberHolder.scale.setScalar(0.02 + 0.98 * swallow);
      chamber.update(mode === 'room' ? chamberT : 0.01);
      // the descent speaks for the room while you are inside it
      if (!descent && swallow > 0.5 && $('mid').textContent !== chamber.label) $('mid').textContent = chamber.label;
    }

    // the day turns at 6am, and she hands over
    if (Date.now() >= turnover.getTime()) {
      todayPos = todaysPosition(); turnover = nextTurnover();
      const loc = locate(todayPos, ringLens); todayWi = loc[0]; todayIx = loc[1];
      presences.forEach((p) => {
        const now = p.wi === todayWi && RINGS[p.wi].indexOf(p.shakti) === todayIx;
        if (now === p.presiding) return;
        p.presiding = now;
        if (now && !p.crown) {
          p.crown = sprite(glow('td', 'rgba(255,255,255,1)', 'rgba(255,255,255,0)'), 0xffffff, 3.4, 0.9);
          p.group.add(p.crown);
        } else if (!now && p.crown) { p.group.remove(p.crown); p.crown = null; }
      });
      shownWorld = -1;
    }

    if (descent) {
      dz += (dzTo - dz) * (reduced ? 0.018 : 0.032);
      descent.update(t, Math.max(0, station), dz / (STATION_Z[Math.max(0, station)] || 1));
      if (station >= 0) $('mid').textContent = descent.words[station] || '';
    }

    // her siddhi lingers on the instrument after you leave
    let expo = 1.04;
    if (after != null) {
      const age = t - afterAt;
      if (age > 24) after = null;
      else expo = 1.04 + 0.12 * (1 - age / 24);
    }
    renderer.toneMappingExposure = expo;

    // the voice: ground from the climb, carrier from her, filter from her adaptation
    if (voice.on) {
      voice.setGround(i0, i1, k);
      if (active) {
        const syl = syllableOf(active);
        voice.setCarrier(active.world.n, swallow, syl);
        const ct = mode === 'room' ? chamberT : 0;
        voice.setRoom(smooth(ct / 62), memory.grantsFifth(active.shakti, active.world.n, ct), active.world.n, syl);
      } else {
        voice.setCarrier(WORLDS[i0].n, 0);
        voice.setRoom(0.25, 0, WORLDS[i0].n);
      }
    }

    yaw += (tYaw - yaw) * 0.06; pitch += (tPitch - pitch) * 0.06;
    const axisEye = new THREE.Vector3(Math.sin(t * 0.07) * 0.5, climb + 1.2, 9 + Math.cos(t * 0.05) * 0.4);
    if (mode === 'axis') camera.position.copy(axisEye);
    else {
      // fly into her point of light, and past it, until you are inside
      HOLD.copy(destPos);
      HOLD.z += 7.4 - swallow * 7.4;
      camera.position.lerpVectors(axisEye, HOLD, smooth(trav));
      camera.position.z += dz;
    }
    const gz = mode === 'axis' ? -1.9 : -1.9 + swallow * 1.6;
    camera.lookAt(
      camera.position.x + Math.sin(yaw) * 9,
      camera.position.y + Math.sin(pitch) * 9 + gz,
      camera.position.z - Math.cos(yaw) * 9
    );

    if (mode === 'axis') {
      writeWorld(k > 0.5 ? i1 : i0);
      const n = nearest();
      $('low').textContent = n
        ? (n.presiding ? `${n.shakti.short || n.shakti.name} — hers is the day`
          : n.authored ? `${n.shakti.short || n.shakti.name} — ${(cardFor(n.shakti, n.world.n, n.shakti.__ix) || {}).quality || 'her room is built'}`
          : `${n.shakti.short || n.shakti.name} — her seat awaits her mechanism`)
        : '';
      enterBtn.textContent = n ? 'enter her' : 'turn to find her';
      deeperBtn.style.display = 'none';
      $('libBtn').style.display = 'none';
      doorL.classList.remove('on'); doorR.classList.remove('on');
      letterBtn.classList.remove('on'); note.classList.remove('on');
    } else if (mode === 'rite') {
      $('low').textContent = active ? active.world.region + ' · ' + active.world.gem + ' on ' + active.world.dhatu : '';
      enterBtn.textContent = beat === 3 ? 'enter her' : 'go on';
      deeperBtn.style.display = 'none';
    } else {
      $('low').textContent = active
        ? (mode === 'room' && active.met && chamberT - headStart < 14 ? 'you have stood here before' : `${active.shakti.name} · ${active.world.gem} on ${active.world.dhatu}`)
        : '';
      enterBtn.textContent = 'return to the axis';
      const c0 = active ? cardFor(active.shakti, active.world.n, active.shakti.__ix) : null;
      deeperBtn.style.display = (mode === 'room' && c0) ? '' : 'none';
      $('libBtn').style.display = mode === 'room' ? '' : 'none';
      const showDoors = mode === 'room' && !descent && !libOpen;
      [[doorL, -1], [doorR, 1]].forEach(([btn, dir]) => {
        btn.classList.toggle('on', showDoors);
        if (!showDoors) return;
        const nb = neighbourOf(active, dir);
        btn.querySelector('b').textContent = nb ? (nb.shakti.short || nb.shakti.name) : '';
      });
      const ltr = letterFor(active);
      letterBtn.classList.toggle('on', !!ltr && mode === 'room' && !descent);
      if (ltr && letterOpen) note.textContent = ltr;
      else if (!ltr) { letterOpen = false; letterBtn.classList.remove('open'); note.classList.remove('on'); }
      deeperBtn.textContent = !descent ? 'go deeper'
        : station >= descent.stations - 1 ? 'come back up' : 'further';
    }
    $('top').style.opacity = dragging ? '0.25' : '1';

    renderer.render(scene, camera);
  } catch (e) { /* keep the last good frame rather than stopping */ }
  requestAnimationFrame(frame);
}

// The instrument does not open on a menu. It opens where she is.
const presiding = presences.find((p) => p.presiding);
if (presiding) { climb = target = worldY(presiding.wi); }
writeWorld(presiding ? presiding.wi : 0);
requestAnimationFrame(frame);
const boot = document.getElementById('boot');
