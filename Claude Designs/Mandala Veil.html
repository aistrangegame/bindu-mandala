<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bindu Mandala — The Veil · The Descent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet"/>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #root { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }

    #stage { width: 390px; height: 844px; flex-shrink: 0; transform-origin: center center;
      border-radius: 30px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,0.6); }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(201,150,63,0.22); border-radius: 2px; }

    /* ── Yantra — Ring 2 per-status petal breathing ── */
    @keyframes ring2TodayBreathe { 0%,100% { opacity:0.78; } 50% { opacity:1.0; filter:brightness(1.45) drop-shadow(0 0 9px rgba(201,150,63,0.8)); } }
    @keyframes ring2EmbodiedBreathe { 0%,100% { opacity:1.0; } 50% { opacity:0.80; } }
    @keyframes ring2ActiveBreathe { 0%,100% { opacity:0.76; } 50% { opacity:0.92; } }
    @keyframes ring2ExploringBreathe { 0%,100% { opacity:0.44; } 50% { opacity:0.56; } }
    @keyframes ring2MappedBreathe { 0%,100% { opacity:0.22; } 50% { opacity:0.28; } }
    .ring2-today { animation: ring2TodayBreathe 3s ease-in-out infinite; }
    .ring2-embodied { animation: ring2EmbodiedBreathe 3.5s ease-in-out infinite; }
    .ring2-active { animation: ring2ActiveBreathe 5s ease-in-out infinite; }
    .ring2-exploring { animation: ring2ExploringBreathe 7s ease-in-out infinite; }
    .ring2-mapped { animation: ring2MappedBreathe 11s ease-in-out infinite; }
    @keyframes ring3PetalBreathe { 0%,100% { opacity:0.17; } 50% { opacity:0.29; } }
    .ring3-petal { animation: ring3PetalBreathe 8s ease-in-out infinite; }
    @keyframes lockR4 { 0%,100% { opacity:0.15; } 50% { opacity:0.22; } }
    @keyframes lockR5 { 0%,100% { opacity:0.10; } 50% { opacity:0.15; } }
    @keyframes lockR6 { 0%,100% { opacity:0.07; } 50% { opacity:0.11; } }
    @keyframes lockR7 { 0%,100% { opacity:0.045;} 50% { opacity:0.07; } }
    .lock-r4 { animation: lockR4 9s ease-in-out infinite; }
    .lock-r5 { animation: lockR5 11s ease-in-out infinite; }
    .lock-r6 { animation: lockR6 13s ease-in-out infinite; }
    .lock-r7 { animation: lockR7 15s ease-in-out infinite; }
    @keyframes deepGhostTri { 0%,100% { opacity:0.028; } 50% { opacity:0.052; } }
    .deep-ghost-tri { animation: deepGhostTri 18s ease-in-out infinite; }
    @keyframes mandalaBinduBreathe {
      0%,100% { transform: translate(-50%,-50%) scale(1); box-shadow: 0 0 14px 6px rgba(139,26,42,0.45); }
      50% { transform: translate(-50%,-50%) scale(1.22); box-shadow: 0 0 26px 14px rgba(139,26,42,0.68), 0 0 52px 28px rgba(139,26,42,0.28); }
    }
    .mandala-bindu-breathe { position:absolute; top:50%; left:50%; border-radius:50%; animation: mandalaBinduBreathe 4s ease-in-out infinite; }
    @keyframes ringIndicatorPulse { 0%,100% { transform: scale(1); box-shadow: 0 0 8px 2px rgba(201,150,63,0.55); } 50% { transform: scale(1.38); box-shadow: 0 0 14px 5px rgba(201,150,63,0.80); } }
    @keyframes moteRise { 0% { transform: translate(0,0); opacity:0; } 8% { opacity:1; } 50% { transform: translate(calc(var(--drift)*.5), -420px); } 92% { opacity:0.5; } 100% { transform: translate(var(--drift), -880px); opacity:0; } }

    /* ── Avaraṇa Threshold — sequential reveal (destination, locked) ── */
    @keyframes tLineIn { from { opacity:0; transform: translateY(7px); } to { opacity:1; transform: translateY(0); } }
    .t-line-1 { animation: tLineIn 1.4s cubic-bezier(.25,.1,.25,1) 0.3s forwards; }
    .t-line-2 { animation: tLineIn 1.2s cubic-bezier(.25,.1,.25,1) 1.1s forwards; }
    .t-line-3 { animation: tLineIn 1.0s cubic-bezier(.25,.1,.25,1) 1.8s forwards; }
    .t-line-4 { animation: tLineIn 1.0s cubic-bezier(.25,.1,.25,1) 2.4s forwards; }
    .t-line-5 { animation: tLineIn 1.0s cubic-bezier(.25,.1,.25,1) 3.0s forwards; }
    .t-line-6 { animation: tLineIn 1.0s cubic-bezier(.25,.1,.25,1) 3.6s forwards; }
    .t-line-7 { animation: tLineIn 1.0s cubic-bezier(.25,.1,.25,1) 4.2s forwards; }
    .t-connection { animation: tLineIn 1.6s cubic-bezier(.25,.1,.25,1) 5.6s forwards; }
    .t-button { animation: tLineIn 1.4s cubic-bezier(.25,.1,.25,1) 6.4s forwards; }

    /* ── Ring 2 World — inhabited lotus (destination, home ring) ── */
    @keyframes rw2Today { 0%,100% { filter: brightness(1) drop-shadow(0 0 4px rgba(201,150,63,0.45)); } 50% { filter: brightness(1.45) drop-shadow(0 0 14px rgba(201,150,63,0.85)); } }
    .rw2-today { animation: rw2Today 3.5s ease-in-out infinite; transform-origin: center; }
    @keyframes rw2TodayHalo { 0%,100% { opacity:0.35; transform: scale(1); } 50% { opacity:0.65; transform: scale(1.08); } }
    .rw2-today-halo { animation: rw2TodayHalo 3.5s ease-in-out infinite; transform-origin: center; }
    @keyframes rw2Embodied { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.18); } }
    @keyframes rw2Active { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.10); } }
    @keyframes rw2Exploring { 0%,100% { filter: brightness(0.95);} 50% { filter: brightness(1.04);} }
    @keyframes rw2Mapped { 0%,100% { filter: brightness(0.92);} 50% { filter: brightness(0.99);} }
    .rw2-embodied { animation: rw2Embodied 4.5s ease-in-out infinite; }
    .rw2-active { animation: rw2Active 6s ease-in-out infinite; }
    .rw2-exploring { animation: rw2Exploring 8s ease-in-out infinite; }
    .rw2-mapped { animation: rw2Mapped 11s ease-in-out infinite; }
    @keyframes rw2InvocIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    .rw2-invoc-name { animation: rw2InvocIn 1.4s ease 0.3s forwards; }
    .rw2-invoc-bija { animation: rw2InvocIn 1.4s ease 0.9s forwards; }
    .rw2-invoc-quality { animation: rw2InvocIn 1.4s ease 1.5s forwards; }
    .rw2-invoc-hint { animation: rw2InvocIn 1.4s ease 2.4s forwards; }

    /* ── The Veil's own atmospherics ── */
    @keyframes veilBinduPulse {
      0%,100% { transform: scale(1); box-shadow: 0 0 14px 5px rgba(139,26,42,0.5); }
      50% { transform: scale(1.16); box-shadow: 0 0 26px 12px rgba(139,26,42,0.7), 0 0 44px 22px rgba(139,26,42,0.30); }
    }
    .veil-bindu { border-radius: 50%; animation: veilBinduPulse 4.5s ease-in-out infinite; }
    @keyframes peekHint { 0%,100% { opacity:0.45; transform: translateY(2px); } 50% { opacity:0.9; transform: translateY(-2px); } }
    .peek-chevron { animation: peekHint 3.2s ease-in-out infinite; }
    @keyframes destIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    .dest-enter { animation: destIn 0.5s cubic-bezier(.22,1,.36,1) forwards; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
<div id="root"><div id="stage"></div></div>

<!-- ── Data ── -->
<script src="shakti-data.js"></script>
<script src="all-shaktis-data.js"></script>

<!-- ── Components (load order matters) ── -->
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="mandala-v2.jsx"></script>
<script type="text/babel" src="screens-v2.jsx"></script>
<script type="text/babel" src="ring-worlds.jsx"></script>
<script type="text/babel" src="legend-explorations.jsx"></script>
<script type="text/babel" src="veil-mandala.jsx"></script>

<!-- ── App + viewport scaler ── -->
<script type="text/babel">
const { VeilMandala } = window;
ReactDOM.createRoot(document.getElementById('stage')).render(<VeilMandala/>);

function fitStage() {
  const stage = document.getElementById('stage');
  const pad = 24;
  const s = Math.min((window.innerWidth - pad) / 390, (window.innerHeight - pad) / 844);
  stage.style.transform = `scale(${Math.min(s, 1.25)})`;
}
window.addEventListener('resize', fitStage);
fitStage();
</script>
</body>
</html>
